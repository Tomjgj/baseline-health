   * a fresh snapshot as a system message), then Claude's reply. Charts run at once and the turn continues;
   * other proposals wait for the person. On failure the new turns are taken back off, so the log stays valid.
   */
  K.send = async (text, { onText, signal } = {}) => {
    const C = App.ctx(), snap = K.snapshot(C), first = !log.length;
    const mark = log.length;
    const content = [...results(C)];
    if (first) content.push({ type: 'text', text: dataBlock(snap) });
    content.push({ type: 'text', text });
    log.push({ role: 'user', content });
    if (!first && snap !== sentSnap) log.push({ role: 'system', content: `Fresher data from the app, replacing the earlier snapshot:\n${dataBlock(snap)}` });
    try {
      for (let hop = 0; hop < 4; hop++) {
        const m = await call(log.map(({ role, content: c }) => ({ role, content: c })), { onText, signal });
        if (m.stop_reason === 'refusal') throw { code: 'refused' };
        log.push({ role: 'assistant', content: m.content, stop: m.stop_reason });
        sentSnap = snap; save();
        const uses = m.content.filter((b) => b.type === 'tool_use');
        // keep going only when every call this turn runs on its own (charts); anything else waits for the person
        if (m.stop_reason !== 'tool_use' || !uses.length || !uses.every((b) => AUTO.has(b.name))) return m;
        log.push({ role: 'user', content: results(App.ctx()) }); save();
        onText?.('');
      }
      return null;
    } catch (e) {
      // take unanswered turns back off the end (nothing after them depends on them yet), so the log ends on Claude's last reply
      while (log.length > mark && log[log.length - 1].role !== 'assistant') log.pop();
      save();
      throw e;
    }
  };
  K.ping = async (c) => {
    const res = await fetch(c.url, { method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${c.code}` }, body: JSON.stringify({ ping: true }) });
    let j = null; try { j = await res.json(); } catch {}
    if (!res.ok) throw { code: j?.error?.code || 'http_' + res.status, message: j?.error?.message };
    return j;
  };
  K.errorText = (e) => ({
    unauthorized: 'The access code doesn’t match the one on your coach server. Check it in Settings.', not_configured: 'The coach server is missing its API key or access code.',
    server_key: 'The coach server’s API key was rejected. Check ANTHROPIC_API_KEY on the server.', rate_limited: 'Claude is busy for this key right now. Try again in a minute.',
    overloaded: 'Claude is overloaded right now. Try again shortly.', unreachable: 'Couldn’t reach your coach server. Check the address in Settings and your connection.',
    too_large: 'This chat has grown too long. Start a new one.', refused: 'Claude couldn’t help with that. Try asking differently.', bad_request: 'The request was refused. Starting a new chat usually fixes this.',
  }[e?.code] || (e?.message ? `Couldn’t get an answer: ${e.message}` : 'Something went wrong reaching Claude. Try again.'));

  // ---------- rare check-ins: one note before an exam or after a hard night ----------
  /** At most one note a day, picked locally (no API call). Frequency: profile.coachNotes = 'off' | 'key' (default) | 'more'. */
  K.note = (C) => {
    const freq = prof().coachNotes || 'key';
    if (freq === 'off') return null;
    const hour = new Date().getHours(), today = C.todayStr, tmr = addDays(today, 1);
    const seen = (k) => !!App.ui.notesSeen?.[k];
    const out = [];
    const exam = C.activitiesOn(tmr).find((a) => a.type === 'exam');
    if (exam && hour >= 15) {
      const lo = Tabs.lightsOut(C, today);
      out.push({ key: 'exam-' + tmr, ic: 'pen', t: `${exam.label || 'Exam'} tomorrow at ${exam.start}`, s: `A calm evening and lights out by ${lo.time || 'your usual time'} help most.`, q: `I have ${exam.name.toLowerCase().startsWith('exam') ? 'an exam' : exam.name.toLowerCase()} tomorrow at ${exam.start}. Help me plan tonight and tomorrow morning.`, page: ['sleep', { date: today }] });
    }
    const r = C.recovery(today);
    if (r && !r.calibrating && r.band === 'low' && hour < 16) out.push({ key: 'low-' + today, ic: 'heart', t: `Recovery is ${r.score}% today`, s: 'A lighter day helps it bounce back. Ask what to change.', q: 'My recovery is low today. What should I change today?', page: ['recovery', { date: today }] });
    if (freq === 'more') {
      const ss = C.sleepScore(today);
      if (ss && ss.score < 60 && hour < 16) out.push({ key: 'sleep-' + today, ic: 'moon', t: `Sleep score ${ss.score} last night`, s: 'Ask how to make up for it today.', q: 'I slept badly last night. How do I get through today and sleep better tonight?', page: ['sleep', { date: today }] });
      const ld = C.load(today);
      if (ld && ld.ratio > 1.3) out.push({ key: 'load-' + today, ic: 'bolt', t: 'Training load is climbing fast', s: `This week is ${ld.ratio.toFixed(1)}× your usual. Ask whether to ease off.`, q: 'My training load is well above my usual. Should I take a rest day?', page: ['strain', { date: today }] });
    }
    return out.find((n) => !seen(n.key)) || null;
  };
  K.openNote = (n) => {
    App.ui.notesSeen = { ...Object.fromEntries(Object.entries(App.ui.notesSeen || {}).slice(-30)), [n.key]: true }; App.saveUi();
    if (K.available()) App.open('coach', { q: n.q }); else App.open(n.page[0], n.page[1]);
  };

  // ---------- starting points that fit the day ----------
  K.suggestions = (C) => {
    const r = C.recovery(C.todayStr), ss = C.sleepScore(C.todayStr), h0 = new Date().getHours(), out = [];
    const exam = C.activitiesOn(addDays(C.todayStr, 1)).some((a) => a.type === 'exam') || C.activitiesOn(C.todayStr).some((a) => a.type === 'exam');
    if (exam) out.push('I have an exam coming up. How should I sleep, eat and train around it?');
    if (ss && ss.score < 60) out.push('Why did I sleep badly, and how do I make up for it today?');
    if (r && !r.calibrating && r.band === 'low') out.push('Why is my recovery low today?');
    else out.push('How recovered am I, and what should I do today?');
    if (!C.planOn(C.todayStr).length && (C.strain(C.todayStr)?.value ?? 0) < 8) out.push('Is today better for rest or for training?');
    if (K.actions()) out.push(h0 < 11 ? 'Log my usual breakfast' : h0 < 15 ? 'I had a chicken wrap and an apple for lunch. Log it.' : 'What should I eat tonight to hit my protein?');
    else out.push(h0 >= 15 ? 'What can I eat to hit my protein tonight?' : 'What should I eat today?');
    out.push('Plan my next 3 workouts', 'What has been driving my stress?');
    return [...new Set(out)].slice(0, 3);
  };

  // ---------- settings: connection, memory, check-ins ----------
  K.settings = () => {
    const c = K.config();
    const urlIn = h('input', { class: 'input', id: 'coach-url', type: 'url', inputmode: 'url', autocomplete: 'off', value: c.url || '', placeholder: 'https://your-coach.workers.dev' });
    const codeIn = h('input', { class: 'input', id: 'coach-code', type: 'password', autocomplete: 'off', value: c.code || '', placeholder: 'the code you set on the server' });
    const status = h('p', { class: 'note', 'aria-live': 'polite' }, c.url ? (c.code ? 'Saved on this device.' : 'Add the access code.') : App.sample ? 'Running inside Claude: answers work, actions need your own coach server.' : 'Not connected yet.');
    const saveConn = () => { K.setConfig({ url: urlIn.value.trim(), code: codeIn.value.trim() }); };
    const memList = h('div', { class: 'list' });
    const drawMem = () => put(memList, K.memory().length ? K.memory().map((m) => {
      const t = h('textarea', { class: 'input', rows: 2, maxlength: 300, 'aria-label': 'Memory note' }, m.text);
      t.value = m.text;
      t.addEventListener('change', () => { const v = t.value.trim(); K.setMemory(v ? K.memory().map((x) => (x.id === m.id ? { ...x, text: v, by: 'you' } : x)) : K.memory().filter((x) => x.id !== m.id)); });
      return h('div', { class: 'mem-row' }, t, h('button', { class: 'icon-btn sm plain', 'aria-label': 'Delete this note', onclick: () => { const prev = K.memory(); K.setMemory(prev.filter((x) => x.id !== m.id)); toast('Note deleted', { action: 'Undo', onAction: () => K.setMemory(prev) }); } }, icon('trash')));
    }) : h('p', { class: 'small muted', style: { padding: '6px 0' } }, 'Nothing yet. Add goals, exam dates, injuries or routines Claude should keep in mind.'));
    drawMem();
    const addIn = h('input', { class: 'input', id: 'coach-mem-add', maxlength: 300, placeholder: 'e.g. Physics exam on Nov 3', onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } } });
    const add = () => { const v = addIn.value.trim(); if (!v) return; K.setMemory([...K.memory(), { id: 'm' + U.uid(), text: v, at: U.today(), by: 'you' }]); addIn.value = ''; };
    return [
      h('p', { class: 'small ink2', style: { lineHeight: 1.55 } }, 'Claude answers from your data and can log food, tag activities, answer habits or move a workout, each only after you confirm. It runs through your own small server, which keeps the API key off this page.'),
      field('Coach server address', urlIn), field('Access code', codeIn),
      h('div', { class: 'btn-row' }, h('button', { class: 'btn', onclick: async () => {
        saveConn(); const cfg = K.config();
        if (!cfg.url || !cfg.code) { status.textContent = 'Add both the address and the access code.'; return; }
        status.textContent = 'Checking…';
        try { const j = await K.ping(cfg); status.textContent = `Connected. Using ${j.model || 'Claude'}.`; } catch (e) { status.textContent = K.errorText(e); }
      } }, 'Save and test'), c.url ? h('button', { class: 'btn ghost', onclick: () => { K.setConfig({}); urlIn.value = ''; codeIn.value = ''; status.textContent = 'Disconnected on this device.'; App.render(); } }, 'Disconnect') : null),
      status,
      h('div', { class: 'divider' }),
      h('label', { class: 'switch', for: 'coach-mem-on' }, h('span', null, 'Let Claude remember notes about you'), h('input', { type: 'checkbox', id: 'coach-mem-on', checked: K.memoryOn(), onchange: (e) => Store.setProfile({ coachMemoryOn: e.target.checked }) })),
      h('p', { class: 'note', style: { marginTop: '-6px' } }, 'Claude reads these every time. It can suggest new ones, which you confirm. With memory off, it reads none of them.'),
      memList,
      h('div', { class: 'row' }, addIn, h('button', { class: 'btn sm', onclick: add }, icon('plus'), 'Add')),
      h('div', { class: 'divider' }),
      field('Check-in notes on Today', seg([['off', 'Off'], ['key', 'Important'], ['more', 'More']], prof().coachNotes || 'key', (v) => Store.setProfile({ coachNotes: v }), { label: 'Check-in notes' }),
        (prof().coachNotes || 'key') === 'more' ? 'also after a poor night or a big jump in training' : (prof().coachNotes || 'key') === 'off' ? 'none' : 'the evening before an exam, and mornings with low recovery'),
      log.length ? h('button', { class: 'btn ghost block', onclick: () => { K.reset(); toast('Chat cleared on this device'); App.render(); } }, icon('trash'), 'Clear the chat on this device') : null,
    ];
  };

  K.describe = describe; K.check = check; K.AUTO = AUTO;
  return K;
})();

/* ===== healthsync.js — live Apple Health data inside the iPhone app =====
   The iOS app (ios/) hosts this page in a web view and reads HealthKit. The page asks for samples
   with  webkit.messageHandlers.baseline.postMessage({ type: 'sync', id, from, to }),  the app answers by calling
   BaselineBridge.receive({ id, ok, payload, error }) with a baseline.health/1 payload (see HI.fromJSON), and the
   same aggregation as the export import turns it into daily summaries. Outside the app none of this runs. */
const HealthSync = (() => {
  const S = {};
  const handler = () => window.webkit?.messageHandlers?.baseline || null;
  S.native = () => !!handler();
  const pending = new Map();
  let busy = null, lastError = null;
  window.BaselineBridge = {
    receive(msg) {
      const p = pending.get(msg?.id);
      if (!p) return;
      pending.delete(msg.id);
      if (msg.ok && msg.payload) p.resolve(typeof msg.payload === 'string' ? JSON.parse(msg.payload) : msg.payload);
      else p.reject(Object.assign(new Error(msg?.error || 'sync-failed'), { code: msg?.error || 'sync-failed' }));
    },
    /** The app calls this when it comes back to the foreground. */
    foreground() { S.maybeSync(); Live.refresh(true); },
    /** The app calls this when the watch has written new heart-rate or HRV readings to Health. */
    changed() { if (document.hidden) return; Live.refresh(true); S.maybeSync(); },
  };
  const ask = (msg, ms = 120000) => new Promise((resolve, reject) => {
    const id = 's' + U.uid();
    pending.set(id, { resolve, reject });
    setTimeout(() => { if (pending.delete(id)) reject(Object.assign(new Error('timeout'), { code: 'timeout' })); }, ms);
    handler().postMessage({ ...msg, id });
  });
  /** Scan a food barcode with the iPhone's camera: resolves to the digits, or rejects with code cancelled / camera_denied / scan_unavailable. */
  S.scan = () => ask({ type: 'scan' }, 600000).then((p) => String(p?.code || ''));
  /** A GET to Open Food Facts made by the app (path starts with /): resolves to { status, text }. */
  S.food = (path) => ask({ type: 'food', path }, 30000);
  /** The last few hours of heart rate and HRV, straight from Health: { at, hr: [[time, bpm]], hrv: [[time, ms]] }. */
  S.latest = () => ask({ type: 'latest' }, 30000);
  const last = () => Store.state().meta?.lastSync || null;
  S.last = last;
  S.error = () => lastError;
  S.busy = () => !!busy;
  /** Sync from the day before the last sync (so a night that was still running gets finished), or 180 days back the first time. */
  S.sync = async ({ quiet = false } = {}) => {
    if (!S.native()) return null;
    if (busy) return busy;
    busy = (async () => {
      await null; // so busy is set before the first render below
      const today = U.today(), prev = last();
      const from = prev?.to ? U.addDays(prev.to, -1) : U.addDays(today, -180);
      try {
        const payload = await ask({ type: 'sync', from: from < U.addDays(today, -400) ? U.addDays(today, -400) : from, to: today });
        const res = HI.fromJSON(payload, { todayStr: today });
        await Store.applyImport(res, null, { kind: 'sync' });
        lastError = null;
        if (!quiet) toast(res.stats.days ? `Synced ${plural(res.stats.days, 'day')} from Apple Health` : 'Apple Health is up to date');
        return res;
      } catch (e) {
        lastError = e?.code || e?.message || 'sync-failed';
        if (!quiet) toast(S.errorText(lastError));
        throw e;
      } finally { busy = null; App.render(); }
    })();
    App.render();
    return busy;
  };
  /** Quietly sync when the app opens, comes back, or the watch delivers new readings, at most every 5 minutes. */
  S.maybeSync = () => {
    if (!S.native() || busy) return;
    if (!Store.ready) { setTimeout(S.maybeSync, 1500); return; } // wait for stored data, or the first sync would look like a fresh start
    const at = last()?.at ? Date.parse(last().at) : 0;
    if (Date.now() - at > 5 * 60e3) S.sync({ quiet: true }).catch(() => {});
  };
  S.errorText = (c) => ({
    not_authorized: 'Baseline doesn’t have access to Apple Health yet. Allow it in Settings → Health → Data Access & Devices → Baseline.',
    unavailable: 'Apple Health isn’t available on this device.', timeout: 'Apple Health took too long to answer. Try again.',
    'not-health-json': 'Apple Health sent something the app couldn’t read.',
  }[c] || 'Couldn’t sync with Apple Health. Try again.');
  /** The Settings and import-page row: when it last synced, and a button. */
  S.row = () => {
    const l = last();
    const sub = busy ? 'Syncing…' : lastError ? S.errorText(lastError) : l ? `Last synced ${U.fmtShort(l.at.slice(0, 10))} at ${l.at.slice(11, 16)} · ${plural(l.days || 0, 'day')} updated` : 'Not synced yet';
    return h('section', { class: 'card tight' }, prow({ ic: 'heart', tone: 'hr', t: 'Apple Health', s: sub,
      right: h('button', { class: 'btn sm primary', disabled: !!busy, onclick: (e) => { e.stopPropagation(); S.sync().catch(() => {}); App.render(); } }, busy ? 'Syncing…' : 'Sync now') }));
  };
  return S;
})();

/* ===== foodnet.js — packaged foods from Open Food Facts (openfoodfacts.org, free, no key): barcode lookup and search =====
   Inside the iPhone app the requests go through the app (HealthSync.food); on the web they're plain fetches.
   Results become per-100 g foods with servings, the same shape as the built-in list, so the portion sheet takes them as-is. */
const FoodNet = (() => {
  const S = {};
  const FIELDS = 'code,product_name,product_name_en,generic_name,brands,quantity,serving_size,serving_quantity,nutriments';
  const cache = new Map();
  async function get(path) {
    if (HealthSync.native()) {
      const r = await HealthSync.food(path);
      if (r.status === 404) return null;
      return JSON.parse(r.text);
    }
    const res = await fetch('https://world.openfoodfacts.org' + path);
    if (res.status === 404) return null;
    if (!res.ok) throw Object.assign(new Error('offline'), { code: 'offline' });
    return res.json();
  }
  const num = (v) => { const n = typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v; return Number.isFinite(n) ? n : null; };
  /** An Open Food Facts product as a food, or null when it has no calories to go on. */
  function toFood(pr) {
    const n = pr?.nutriments || {};
    let kcal = num(n['energy-kcal_100g']);
    if (kcal == null && num(n.energy_100g) != null) kcal = num(n.energy_100g) / 4.184; // kJ
    if (kcal == null || kcal < 0 || kcal > 950) return null;
    const name0 = String(pr.product_name || pr.product_name_en || pr.generic_name || '').trim();
    if (!name0) return null;
    const brand = String(pr.brands || '').split(',')[0].trim();
    const name = (brand && !name0.toLowerCase().includes(brand.toLowerCase()) ? `${name0} (${brand})` : name0).slice(0, 80);
    const liquid = /\d\s*(ml|cl|l)\b/i.test(pr.quantity || '') || /\d\s*(ml|cl)\b/i.test(pr.serving_size || '');
    const servings = [];
    const sq = num(pr.serving_quantity);
    if (sq > 0 && sq < 2000) servings.push({ label: `1 serving (${pr.serving_size && pr.serving_size.length < 30 ? pr.serving_size : Math.round(sq) + (liquid ? ' ml' : ' g')})`, g: Math.round(sq) });
    servings.push({ label: liquid ? '100 ml' : '100 g', g: 100 });
    const pq = num(String(pr.quantity || '').match(/[\d.,]+/)?.[0]);
    if (pq > 0 && pq < 3000 && /\d\s*(g|ml)\b/i.test(pr.quantity || '') && !servings.some((x) => x.g === Math.round(pq))) servings.push({ label: `whole pack (${Math.round(pq)} ${liquid ? 'ml' : 'g'})`, g: Math.round(pq) });
    return { id: 'off' + pr.code, code: String(pr.code || ''), name, kcal: Math.round(kcal), p: U.round(num(n.proteins_100g) || 0, 1), c: U.round(num(n.carbohydrates_100g) || 0, 1),
      f: U.round(num(n.fat_100g) || 0, 1), fiber: U.round(num(n.fiber_100g) || 0, 1), liquid, servings, group: 'Packaged', src: 'off' };
  }
  S.toFood = toFood;
  /** The food with this barcode, or null if Open Food Facts doesn't know it (or knows it without nutrition values). */
  S.byBarcode = async (code) => {
    code = String(code).replace(/\D/g, '');
    if (!code) return null;
    if (cache.has('b' + code)) return cache.get('b' + code);
    const j = await get(`/api/v2/product/${code}.json?fields=${FIELDS}`);
    const f = j && j.status === 1 ? toFood({ ...j.product, code: j.product?.code || code }) : null;
    cache.set('b' + code, f);
    return f;
  };
  /** Up to 20 packaged foods matching the words, most scanned first. */
  S.search = async (q) => {
    q = q.trim().toLowerCase();
    if (q.length < 2) return [];
    if (cache.has('s' + q)) return cache.get('s' + q);
    const j = await get(`/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&sort_by=unique_scans_n&fields=${FIELDS}`);
    const seen = new Set();
    const out = (j?.products || []).map(toFood).filter((f) => f && !seen.has(f.name.toLowerCase()) && seen.add(f.name.toLowerCase())).slice(0, 20);
    cache.set('s' + q, out);
    return out;
  };
  S.errorText = (e) => ({
    cancelled: '', camera_denied: 'Baseline can’t use the camera. Allow it in the Settings app → Baseline → Camera.',
    scan_unavailable: 'This iPhone can’t scan barcodes with the camera. Search for the food instead.',
  }[e?.code] ?? 'Couldn’t reach the food database. Check your connection and try again.');
  return S;
})();

/* ===== ui-train.js — workout logger, finish summary, sessions, exercises, routines, muscles, load ===== */
const Train = (() => {
  const { fmtDur, fmtInt, fmt1, fmtSigned, addDays } = U;
  const T = {};
  const view = (...kids) => h('div', { class: 'view' }, kids);

  const FRESH = { recovered: ['Recovered', 'var(--good)'], fatigued: ['Fatigued', 'var(--warn)'], depleted: ['Depleted', 'var(--crit)'] };
  T.FRESH = FRESH;
  T.freshFill = (o) => (!o.last ? { color: 'var(--good)', opacity: 0.85, title: 'Recovered, not trained this week' } : { color: FRESH[o.status][1], opacity: 0.88, title: `${FRESH[o.status][0]}, ${o.fresh}% fresh` });
  T.muscleInsight = (mst) => {
    const upper = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps'], lower = ['Quads', 'Hamstrings', 'Glutes', 'Calves'];
    const avg = (gs) => U.mean(gs.map((g) => mst[g].fresh));
    const u = avg(upper), l = avg(lower);
    const low = E.MUSCLES.filter((g) => mst[g].last && mst[g].status !== 'recovered').sort((a, b) => mst[a].fresh - mst[b].fresh);
    if (low.length) {
      // fatigue fades with a 48-hour time constant; "recovered" starts at 70% fresh (fatigue 2.7)
      const hrs = 48 * Math.log(Math.max(2.71, mst[low[0]].fatigue) / 2.7);
      const days = Math.max(1, Math.round(hrs / 24));
      return `${low.slice(0, 3).join(', ')} need about ${plural(days, 'more day')}. ${u > l + 8 ? 'Your upper body is the fresher half, so it suits the next session.' : l > u + 8 ? 'Legs are the fresher half, so a lower-body day fits next.' : 'Pick muscles that are marked recovered.'}`;
    }
    return Math.abs(u - l) > 8 ? `Everything is recovered. ${u > l ? 'Upper body' : 'Lower body'} has rested a little longer.` : 'Every muscle group is recovered and ready to train.';
  };

  /** A fresh exercise for the logger, pre-filled from last time and the progression rule. */
  T.draftExercise = (C, name, o = {}) => {
    const cfg = C.exSettings(name), pr = C.progression(name), ls = C.lastSets(name);
    const n = o.sets || (ls ? ls.sets.filter((x) => x.t !== 'W').length : 3) || 3;
    const top = pr ? pr.w : ls ? Math.max(0, ...ls.sets.map((x) => +x.w || 0)) : null;
    const sets = [];
    if (o.warmup && cfg.barbell && top > 30) sets.push({ t: 'W', w: Math.round((top * 0.6) / 2.5) * 2.5, r: '', ph: 10, rpe: '', done: false });
    for (let k = 0; k < n; k++) {
      const ph = pr?.reps?.length ? pr.reps[Math.min(k, pr.reps.length - 1)] : typeof o.reps === 'number' ? o.reps : '';
      sets.push({ t: 'N', w: top != null && top > 0 ? top : cfg.bodyweight ? 0 : '', r: '', ph, rpe: '', done: false });
    }
    return { id: U.uid(), name, rest: o.rest ?? cfg.rest, group: o.group || null, sets };
  };
  const wDisp = (kg) => (kg === '' || kg == null ? '' : String(U.round(U.kgTo(+kg, units()), 2)));
  const setStr = (x) => `${+x.w > 0 ? fmtW(+x.w) : 'BW'} × ${x.r}`;
  T.setStr = setStr;

  /** Tag a block of the day (school, work, studying…), once or every week. A weekly one can be changed for every week or for one day. */
  S.activity = ({ date, item = null, type: preType = null } = {}) => {
    const c = C(), today = c.todayStr;
    const sched = () => (Store.state().schedule || []).slice();
    const tpl = item?.templateId ? sched().find((x) => x.id === item.templateId) : null;
    let type = item?.type || preType || 'school';
    const wdOf = (d) => (U.parseYmd(d).getDay() + 6) % 7;
    let repeat = item ? (item.repeats ? 'weekly' : 'once') : ACT_DEFAULTS[type][2] ? 'weekly' : 'once';
    let days = tpl ? [...tpl.days] : ACT_DEFAULTS[type][2] === 'weekdays' ? [0, 1, 2, 3, 4] : [wdOf(date)];
    const startIn = h('input', { class: 'input', id: 'act-start', type: 'time', value: item?.start || ACT_DEFAULTS[type][0] });
    const endIn = h('input', { class: 'input', id: 'act-end', type: 'time', value: item?.end || ACT_DEFAULTS[type][1] });
    const dateIn = h('input', { class: 'input', id: 'act-date', type: 'date', value: date });
    const nameIn = h('input', { class: 'input', id: 'act-name', value: item?.label || '', placeholder: 'e.g. Band practice, Driving lessons', maxlength: 32 });
    let touched = !!item;
    startIn.addEventListener('input', () => { touched = true; }); endIn.addEventListener('input', () => { touched = true; });
    const typeHost = h('div'), nameHost = h('div'), whenHost = h('div'), repeatHost = h('div');
    const err = h('p', { class: 'error-text', hidden: true });
    const drawType = () => {
      put(typeHost, h('div', { class: 'typepick', role: 'group', 'aria-label': 'Activity' }, E.ACTIVITY_TYPES.map((t) => h('button', { type: 'button', 'aria-pressed': String(t.id === type), onclick: () => {
        type = t.id;
        if (!touched) { startIn.value = ACT_DEFAULTS[type][0]; endIn.value = ACT_DEFAULTS[type][1]; }
        if (!item) { const rp = ACT_DEFAULTS[type][2]; repeat = rp ? 'weekly' : 'once'; days = rp === 'weekdays' ? [0, 1, 2, 3, 4] : [wdOf(dateIn.value || date)]; drawRepeat(); drawWhen(); }
        drawType();
      } }, icon(t.icon), t.name))));

    };

        : field('Day', dateIn));

          h('button', { class: 'btn danger', onclick: () => { const snap = actSnap([]); Store.setSchedule(tpl.from && tpl.from < today ? sched().map((x) => (x.id === tpl.id ? { ...x, until: U.addDays(today, -1) } : x)) : sched().filter((x) => x.id !== tpl.id)); ch.close(); toast('Removed from every week', { action: 'Undo', onAction: () => actRestore(snap) }); } }, 'Every week')] });
    };
    const sh = Sheets.open({
      title: item ? 'Edit activity' : 'Add an activity', full: true,
      body: [typeHost, nameHost, h('div', { class: 'grid2' }, field('Start', startIn), field('End', endIn)), repeatHost, whenHost, err,

/* ===== app.js — shell: tabs, a stack of pushed pages, floating bars, the clock, boot ===== */
const App = (() => {
  const TABS = [['today', 'Today', 'today'], ['food', 'Food', 'food'], ['train', 'Train', 'train'], ['health', 'Health', 'health']];
  const A = { tab: 'today', date: U.today(), sample: null, imgLimits: null, downloads: null, draft: null, chat: [], stack: [], rest: null, ui: {}, plate: [] };
  let cache = { v: -1, day: null, C: null };
  let anim = null;
  const scrollMemo = {};
  // 'instant' also cancels a smooth scroll still running on the previous screen
  const jump = (y) => window.scrollTo({ top: y, behavior: 'instant' });

  A.ctx = () => {
    const day = U.today();
    if (cache.v !== Store.version || cache.day !== day || !cache.C) cache = { v: Store.version, day, C: E.context(Store.state(), new Date()) };
    return cache.C;
  };
  A.top = () => A.stack[A.stack.length - 1] || null;

  A.go = (tab) => {
    if (!TABS.some((t) => t[0] === tab)) return;
    if (!A.stack.length) scrollMemo[A.tab] = window.scrollY;
    const same = tab === A.tab && !A.stack.length;
    A.stack = [];
    A.tab = tab;
    Store.lsSet('tab', tab);
    Sheets.closeAll();
    anim = same ? null : 'tab';
    renderNow();
    if (same) window.scrollTo({ top: 0, behavior: 'smooth' }); else jump(scrollMemo[tab] || 0);
  };
  A.open = (page, args = {}, { replace = false } = {}) => {
    if (!Pages[page]) { console.warn('no page', page); return; }
    Sheets.closeAll();
    const top = A.top();
    if (top) top.scroll = window.scrollY; else scrollMemo[A.tab] = window.scrollY;
    if (replace && top) A.stack.pop();
    A.stack.push({ page, args, scroll: 0 });
    anim = replace ? null : 'push';
    renderNow();
    jump(0);
  };
  A.back = () => {
    const top = A.top();
    if (!top) return;
    const P = Pages[top.page];
    if (P.canLeave && !P.canLeave(top)) return;
    A.stack.pop();
    Sheets.closeAll();
    anim = 'pop';
    renderNow();
    const nt = A.top();
    jump(nt ? nt.scroll || 0 : scrollMemo[A.tab] || 0);
  };
  A.setDate = (d) => { if (d > U.today()) d = U.today(); A.date = d; render(); };
  A.setTheme = (v) => {
    if (v === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    Store.lsSet('theme', v === 'system' ? null : v);
  };
  A.saveUi = () => Store.lsSet('ui', JSON.stringify(A.ui));
  A.saveDraft = () => Store.lsSet('workout-draft', A.draft ? JSON.stringify(A.draft) : null);

  // ---------- rest timer ----------
  A.startRest = (sec, next) => {
    if (!(sec > 0)) { A.rest = null; renderFloats(); return; }
    A.rest = { end: Date.now() + sec * 1000, total: sec, next: next || '' };
    if (A.draft) { A.draft.rest = A.rest; A.saveDraft(); }
    renderFloats();
  };
  A.adjustRest = (d) => {
    if (!A.rest) return;
    A.rest.end += d * 1000;
    A.rest.total = Math.max(A.rest.total, Math.ceil((A.rest.end - Date.now()) / 1000));
    if (A.rest.end <= Date.now()) A.stopRest(); else tick();
  };
  A.stopRest = () => { A.rest = null; if (A.draft) { delete A.draft.rest; A.saveDraft(); } renderFloats(); };
  A.elapsed = () => (A.draft ? Math.max(0, Math.floor((Date.now() - new Date(A.draft.startedAt)) / 1000)) : 0);

  // ---------- render ----------
  let raf = 0;
  function render() { cancelAnimationFrame(raf); raf = requestAnimationFrame(renderNow); }
  A.render = render;

  function loadingView() {
    return h('div', { class: 'view', 'aria-busy': 'true' }, h('div', { class: 'skeleton', style: { height: '84px' } }),
      h('div', { class: 'scores' }, [0, 1, 2].map(() => h('div', { class: 'skeleton', style: { height: '150px' } }))),
      h('div', { class: 'skeleton', style: { height: '220px' } }), h('p', { class: 'note', style: { textAlign: 'center' } }, 'Loading your data…'));
  }

  function renderNow() {
    Charts.hideTip();
    const top = A.top();
    const P = top ? Pages[top.page] : null;
    const flow = !!P?.flow;
    document.getElementById('app').classList.toggle('flow', flow);
    document.getElementById('dock').hidden = flow;
    for (const btn of document.querySelectorAll('.tab')) btn.setAttribute('aria-current', !top && btn.dataset.tab === A.tab ? 'page' : 'false');
    const view = document.getElementById('view');
    view.className = anim ? 'anim-' + anim : '';
    anim = null;
    if (!Store.ready) { put(view, loadingView()); renderFloats(); return; }
    const C = A.ctx();
    try {
      if (P) {
        if (P.keep && top.el && top.el.isConnected === false && top.v === Store.version) put(view, top.el);
        else if (P.keep && top.el) { P.refresh?.(top.el, C, top.args, top); if (!top.el.isConnected) put(view, top.el); }
        else { top.el = P.render(C, top.args || {}, top); put(view, top.el); }
        top.v = Store.version;
      } else {
        put(view, Tabs[A.tab](C, A.date));
      }
    } catch (e) {
      console.error(e);
      put(view, h('div', { class: 'view' }, card(emptyState('info', 'Something went wrong showing this screen', 'Your data is safe. Go back or try another day.',
        top ? h('button', { class: 'btn', onclick: () => A.back() }, 'Go back') : null))));
    }
    renderFloats();
    // compact title bar that fades in once a tab's large title has scrolled away
    const mh = document.getElementById('minihead');
    mh.hidden = !!top;
    if (!top) mh.firstChild.textContent = view.querySelector('.thead h1')?.textContent || '';
  }

  function renderFloats() {
    const host = document.getElementById('float');
    const top = A.top();
    const P = top ? Pages[top.page] : null;
    const items = [];
    if (P?.float) { const f = P.float(A.ctx(), top.args || {}, top); if (f) items.push(f); }
    if (A.rest && A.draft && top?.page === 'workout') items.push(restBar());
    else if (A.draft && top?.page !== 'workout' && !P?.flow && !P?.float) items.push(workoutBar());
    put(host, items);
    document.getElementById('app').classList.toggle('has-bar', items.length > 0);
    fabFor(top);
    tick();
  }
  A.renderFloats = renderFloats;

  /** The one add button: on Food it says "Add food" and opens the meal that's due; everywhere else it opens the + sheet. */
  function fabFor(top) {
    const fab = document.getElementById('fab');
    const food = !top && A.tab === 'food' && Store.ready;
    const key = food ? 'food:' + A.date + ':' + (A.date === U.today() ? mealForNow() : 'snack') : 'add';
    if (fab.dataset.key === key) return;
    fab.dataset.key = key;
    fab.classList.toggle('wide', food);
    if (food) {
      const meal = A.date === U.today() ? mealForNow() : 'snack';
      fab.replaceChildren(icon('plus'), h('span', null, 'Add food'));
      fab.setAttribute('aria-label', `Add food to ${mealName(meal).toLowerCase()}`);
      fab.onclick = () => A.open('foodlog', { date: A.date, meal, mode: 'search' });
    } else {
      fab.replaceChildren(icon('plus'));
      fab.setAttribute('aria-label', 'Log something');
      fab.onclick = () => Sheet.add();
    }
  }

  function restBar() {
    const r = A.rest;
    return h('section', { class: 'rest-bar', 'aria-label': 'Rest timer', 'aria-live': 'polite' },
      h('div', { class: 'tr' }, h('div', { 'data-tick': 'restbar', style: { width: '100%' } })),
      h('div', { class: 'bd' },
        h('div', { class: 'row' }, h('div', null, h('div', { class: 'lb' }, 'REST'), h('div', { class: 'tm', 'data-tick': 'rest' }, fmtMMSS((r.end - Date.now()) / 1000))),
          h('div', { class: 'nx' }, h('b', null, 'Up next'), r.next || 'Your next set')),
        h('div', { class: 'btns' },
          h('button', { class: 'btn', onclick: () => A.adjustRest(-15) }, '−15 s'),
          h('button', { class: 'btn', onclick: () => A.adjustRest(15) }, '+15 s'),
          h('button', { class: 'btn primary', onclick: () => A.stopRest() }, 'Skip'))));
  }
  function workoutBar() {
    const d = A.draft;
    const sets = d.exercises.reduce((a, ex) => a + ex.sets.filter((x) => x.done && x.t !== 'W').length, 0);
    return h('button', { class: 'wk-bar tap', onclick: () => A.open('workout'), 'aria-label': 'Return to your workout' },
      h('div', { class: 'tx' }, h('div', { class: 't' }, d.name || 'Workout'), h('div', { class: 's' }, h('span', { 'data-tick': 'elapsed' }, fmtMMSS(A.elapsed())), ` · ${plural(sets, 'set')} done`)),
      h('span', { class: 'go' }, icon('play'), 'Resume'));
  }

  // ---------- one clock for timers ----------
  function tick() {
    for (const el of document.querySelectorAll('[data-tick="elapsed"]')) el.textContent = fmtMMSS(A.elapsed());
    if (A.rest) {
      const left = (A.rest.end - Date.now()) / 1000;
      if (left <= 0) {
        A.rest = null;
        if (A.draft) { delete A.draft.rest; A.saveDraft(); }
        try { navigator.vibrate?.([120, 80, 120]); } catch {}
        toast('Rest is over. Time for your next set.');
        renderFloats();
        return;
      }
      for (const el of document.querySelectorAll('[data-tick="rest"]')) el.textContent = fmtMMSS(Math.ceil(left));
      for (const el of document.querySelectorAll('[data-tick="restbar"]')) el.style.width = Math.max(0, Math.min(100, (left / A.rest.total) * 100)) + '%';
    }
  }

  function buildShell() {
    const nav = document.getElementById('tabs');
    put(nav, TABS.map(([id, name, ic]) => h('button', { class: 'tab', 'data-tab': id, 'aria-current': 'false', onclick: () => A.go(id) }, icon(ic), name)));
  }

  async function boot() {
    const theme = Store.lsGet('theme');
    if (theme) A.setTheme(theme);
    const tab = Store.lsGet('tab');
    if (tab && TABS.some((t) => t[0] === tab)) A.tab = tab;
    try { const d = Store.lsGet('workout-draft'); if (d) { A.draft = JSON.parse(d); if (A.draft?.rest && A.draft.rest.end > Date.now()) A.rest = A.draft.rest; } } catch {}
    try { A.ui = JSON.parse(Store.lsGet('ui') || '{}') || {}; } catch { A.ui = {}; }
    const hash = (location.hash || '').slice(1);
    if (TABS.some((t) => t[0] === hash)) A.tab = hash;
    buildShell();
    Store.onError((e) => {
      const c = e && e.code;
      if (c === 'quota_exceeded') toast('Storage for this app is full. Delete old data in Settings to keep logging.', { ms: 7000 });
      else if (c === 'invalid_argument') toast('Only the owner of this app can save data.', { ms: 6000 });
      else if (c === 'resource_exhausted') toast('Saving too fast. Give it a second and try again.');
      else toast('Couldn’t save that. Check your connection and try again.');
    });
    Store.subscribe(() => {
      // in the iPhone app the first sync brings real data straight in, so there's no sample-data welcome
      if (Store.firstRun) { Store.firstRun = false; if (!HealthSync.native()) setTimeout(() => Sheet.welcome(), 450); }
      render();
    });
    renderNow();
    const cl = window.claude;
    if (cl && typeof cl.use === 'function') {
      cl.use('sample').then((fn) => {
        A.sample = fn || null;
        if (fn) fn.limits?.().then((l) => { A.imgLimits = l?.images || null; }).catch(() => {});
        render();
      }).catch(() => {});
      cl.use('downloads').then((d) => { A.downloads = d || null; }).catch(() => {});
    }
    setInterval(tick, 1000);
    await Store.init();
    render();
    HealthSync.maybeSync();
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); HealthSync.maybeSync(); } });
  // swipe in from the left edge to go back, like iOS
  let edge = null;
  window.addEventListener('touchstart', (e) => { const t = e.touches[0]; edge = A.stack.length && !Sheets.count && t.clientX < 24 ? { x: t.clientX, y: t.clientY } : null; }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (!edge) return;
    const t = e.changedTouches[0], dx = t.clientX - edge.x, dy = Math.abs(t.clientY - edge.y);
    edge = null;
    if (dx > 80 && dy < 60) A.back();
  }, { passive: true });
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    document.body.classList.toggle('scrolled', y > 6);
    document.body.classList.toggle('past-title', y > 58);
  }, { passive: true });
  document.getElementById('minihead-btn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  window.addEventListener('keydown', (e) => {
    if (Sheets.count) return;
    if (e.key === 'Escape' && A.stack.length && !e.target.closest?.('input, textarea, select')) { e.preventDefault(); A.back(); return; }
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
    if (e.key === 'ArrowLeft' && e.altKey) A.setDate(U.addDays(A.date, -1));
    if (e.key === 'ArrowRight' && e.altKey) A.setDate(U.addDays(A.date, 1));
  });

  A.boot = boot;
  A.TABS = TABS;
  return A;
})();

App.boot();

</script>

</body></html>
