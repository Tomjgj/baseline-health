/* ---------- base ---------- */
/* On iPhone and iPad, take the root size from Dynamic Type (17 px at the default setting) */
@supports (font: -apple-system-body) { @media (hover: none) and (pointer: coarse) {
  html { font: -apple-system-body; }
  :root { --fs: calc(1rem / 17); }
} }
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: calc(15 * var(--fs)); line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding-inline: 16px; padding-block: 0; min-height: 100%; overflow-x: clip;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; letter-spacing: -0.01em; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: calc(13 * var(--fs)); }
.xs { font-size: calc(12 * var(--fs)); }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.top { align-items: flex-start; }
.row.base { align-items: baseline; }
.col { display: grid; gap: 10px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.up { color: var(--good-ink); } .down { color: var(--crit-ink); } .warnc { color: var(--warn-ink); }
.note { font-size: calc(12.5 * var(--fs)); line-height: 1.5; color: var(--muted); }
.error-text { color: var(--crit-ink); font-size: calc(13 * var(--fs)); }

/* ---------- app frame ---------- */
#app { position: relative; max-width: 560px; margin-inline: auto; padding-bottom: calc(var(--dock-h) + 40px + env(safe-area-inset-bottom, 0px)); }
#app.has-bar { padding-bottom: calc(var(--dock-h) + 108px + env(safe-area-inset-bottom, 0px)); }
#app.flow { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
#app.flow.has-bar { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
#ambient {
  position: absolute; z-index: 0; left: 50%; top: calc(-1 * env(safe-area-inset-top, 0px) - 40px); width: min(760px, 190vw); height: 440px; transform: translateX(-50%);
  pointer-events: none; opacity: var(--amb); transition: --tint 0.7s ease, --tint-2 0.7s ease;
  background:
    radial-gradient(48% 62% at 28% 0%, color-mix(in oklab, var(--tint) 70%, transparent), transparent 72%),
    radial-gradient(42% 52% at 82% 6%, color-mix(in oklab, var(--tint-2) 55%, transparent), transparent 70%);
  filter: blur(8px);
}
#view { position: relative; z-index: 1; }
.view { display: grid; gap: 14px; padding-top: 14px; }
.view > *, .sheet-body > * { min-width: 0; }
#view.anim-tab > .view { animation: viewIn 0.34s var(--ease) backwards; }
#view.anim-push > .view { animation: pushIn 0.36s var(--spring) backwards; }
#view.anim-pop > .view { animation: popIn 0.32s var(--spring) backwards; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pushIn { from { opacity: 0; transform: translateX(34px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }

/* ---------- headers ---------- */
/* Title and actions share row 1; the subtitle gets the full width of row 2 so it never wraps beside the buttons. */
.thead { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding-top: 10px; }
.thead .tt { display: contents; }
.thead h1 { grid-column: 1; grid-row: 1; font-size: calc(34 * var(--fs)); font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; min-width: 0; }
.thead .tt > :not(h1) { grid-column: 1 / -1; grid-row: 2; justify-self: start; min-width: 0; }
.thead .sub { font-size: calc(14 * var(--fs)); color: var(--muted); margin-top: 3px; }
.thead .acts { grid-column: 2; grid-row: 1; display: flex; gap: 8px; align-items: center; }
.date-pick { position: relative; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: calc(14 * var(--fs)); border: 0; background: none; padding: 0; }
.date-pick input { position: absolute; inset: -12px -4px; opacity: 0; width: 100%; cursor: pointer; }
.datebar { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
.datebar .icon-btn { width: 32px; height: 32px; background: transparent; }
.datebar .icon-btn svg { width: 18px; height: 18px; }
.datebar .date-pick { color: var(--ink-2); font-weight: 650; }
.phead {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 10px;
  margin-inline: -16px; padding: 10px 16px; transition: background 0.25s, box-shadow 0.25s;
}
body.scrolled .phead { background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.7); backdrop-filter: blur(20px) saturate(1.7); box-shadow: 0 1px 0 var(--line); }
/* tabs: the large title collapses into a small glass bar on scroll, like iOS */
.minihead { position: fixed; left: 0; right: 0; top: 0; z-index: 40; padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.7); backdrop-filter: blur(20px) saturate(1.7); box-shadow: 0 1px 0 var(--line);
  opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity 0.22s var(--ease), transform 0.22s var(--ease); }
body.past-title .minihead { opacity: 1; transform: none; pointer-events: auto; }
.minihead button { display: block; width: 100%; height: 44px; border: 0; background: none; color: var(--ink); font-size: calc(16 * var(--fs)); font-weight: 800; letter-spacing: -0.01em; }
.phead .pt { flex: 1; min-width: 0; }
.phead h1 { font-size: calc(22 * var(--fs)); font-weight: 800; letter-spacing: -0.015em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phead .sub { font-size: calc(13 * var(--fs)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pager { flex: 1; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.pager button { min-height: 38px; border: 0; border-radius: 999px; background: transparent; font-size: calc(13 * var(--fs)); font-weight: 750; color: var(--ink-2); padding: 0 4px; white-space: nowrap; transition: background 0.2s, color 0.2s; }
.pager button[aria-current="page"] { background: var(--accent); color: var(--on-accent); }

/* ---------- buttons ---------- */
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none; display: inline-grid; place-items: center;
  background: var(--glass); color: var(--ink); box-shadow: inset 0 0 0 1px var(--glass-line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  transition: transform 0.12s var(--ease), background 0.2s;
}
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.plain { background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.icon-btn.sm { width: 36px; height: 36px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.ask {
  min-height: 40px; padding: 0 14px 0 12px; border-radius: 999px; border: 0; display: inline-flex; align-items: center; gap: 7px;
  background: var(--glass); color: var(--ink); font-size: calc(14 * var(--fs)); font-weight: 750; white-space: nowrap;
  box-shadow: inset 0 0 0 1px var(--glass-line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); transition: transform 0.12s var(--ease);
}
.ask svg { width: 17px; height: 17px; color: var(--claude); }
.btn {
  min-height: 48px; padding-inline: 20px; border-radius: 999px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-3); color: var(--ink); font-size: calc(15 * var(--fs)); font-weight: 750; white-space: nowrap; transition: transform 0.12s var(--ease), background 0.2s, opacity 0.2s;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.go { background: var(--go); color: var(--on-go); }
.btn.tint { background: var(--claude-bg-2); color: var(--claude); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { background: var(--crit-bg); color: var(--crit-ink); }
.btn.quiet { background: transparent; color: var(--ink-2); padding-inline: 10px; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding-inline: 14px; font-size: calc(13.5 * var(--fs)); }
.btn.lg { min-height: 56px; font-size: calc(16.5 * var(--fs)); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 130px; }
.link { border: 0; background: none; padding: 4px 0; font-size: calc(14 * var(--fs)); font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.link svg { width: 16px; height: 16px; }
:is(.btn, .icon-btn, .ask, .chip, .tap, .pick, .score, .fab, .tab):active:not(:disabled) { transform: scale(0.965); }
/* 44 pt touch targets: small controls keep their look, and an invisible layer grows the area you can tap to at least 44 × 44 */
:is(.btn.sm, .seg button, .link, .icon-btn.sm, .datebar .icon-btn, .cal-nav .icon-btn, .chip, button.pill, .add-line, .ask, .qty button, .yn button, .toast button, .pager button, .pick .btn, .icon-btn.plain) { position: relative; }
:is(.btn.sm, .seg button, .link, .icon-btn.sm, .datebar .icon-btn, .cal-nav .icon-btn, .chip, button.pill, .add-line, .ask, .qty button, .yn button, .toast button, .pager button, .pick .btn, .icon-btn.plain)::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%);
}
.tap { cursor: pointer; transition: transform 0.14s var(--ease), background 0.2s; }

/* ---------- cards & sections ---------- */
.card { position: relative; background: var(--surface); border-radius: var(--r-lg); padding: 18px; box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), var(--card-shadow); min-width: 0; }
.card.tight { padding: 14px; }
.card.flush { padding: 6px 18px; }
.ask-row svg { width: 18px; height: 18px; flex: none; color: var(--ink-2); }
.card.claude { background: linear-gradient(160deg, var(--claude-bg-2), var(--claude-bg) 60%), var(--surface); }
button.card, a.card { width: 100%; border: 0; text-align: left; color: inherit; font: inherit; display: block; }
a.btn { text-decoration: none; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; min-height: 24px; }
.card-title h2 { font-size: calc(17 * var(--fs)); font-weight: 800; letter-spacing: -0.01em; }
.card-title .r { font-size: calc(12.5 * var(--fs)); color: var(--muted); text-align: right; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 4px -4px; }
.section-title h2 { font-size: calc(20 * var(--fs)); font-weight: 800; letter-spacing: -0.015em; }
.section-title .r { font-size: calc(13 * var(--fs)); color: var(--muted); }
.eyebrow { font-size: calc(11.5 * var(--fs)); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.eyebrow svg { width: 14px; height: 14px; }
.divider { height: 1px; background: var(--line); margin-block: 12px; }
.big-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(34 * var(--fs)); font-weight: 750; line-height: 1.05; letter-spacing: -0.02em; }
.big-num small, .mid-num small { font-family: var(--font); font-size: calc(14 * var(--fs)); font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.mid-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(24 * var(--fs)); font-weight: 750; line-height: 1.1; letter-spacing: -0.01em; }
.huge-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(60 * var(--fs)); font-weight: 750; line-height: 1; letter-spacing: -0.03em; }
.huge-num small { font-family: var(--font); font-size: calc(17 * var(--fs)); font-weight: 650; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 7px; font-size: calc(14 * var(--fs)); }
.kv > span:first-child { color: var(--ink-2); }
.kv .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.kv.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; font-weight: 800; }
.kv.total > span:first-child { color: var(--ink); }
.list > * + * { border-top: 1px solid var(--line); }
.stat .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(24 * var(--fs)); font-weight: 750; line-height: 1.1; }
.stat .k { font-size: calc(12.5 * var(--fs)); font-weight: 650; color: var(--muted); margin-top: 2px; }

/* ---------- chips, pills, segmented ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
.chips.small .chip { min-height: 32px; padding-inline: 11px; font-size: calc(13 * var(--fs)); gap: 6px; }
.chip {
  flex: none; min-height: 38px; padding-inline: 14px; border-radius: 999px; border: 0; display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface-2); color: var(--ink); font-size: calc(14 * var(--fs)); font-weight: 650; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--line);
  transition: transform 0.12s var(--ease), background 0.2s, color 0.2s;
}
.chip svg { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.chip.claude { background: var(--claude-bg-2); color: var(--ink); box-shadow: none; }
.chip .k { color: var(--muted); font-weight: 600; }
.chip[aria-pressed="true"] .k { color: inherit; opacity: 0.7; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding-inline: 10px; border-radius: 999px; font-size: calc(12.5 * var(--fs)); font-weight: 750; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill svg { width: 14px; height: 14px; }
.pill.good { background: var(--good-bg); color: var(--good-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.crit { background: var(--crit-bg); color: var(--crit-ink); }
.pill.strain { background: var(--strain-bg); color: var(--strain-ink); }
.pill.sleep { background: var(--sleep-bg); color: var(--sleep-ink); }
.pill.stress { background: var(--stress-bg); color: var(--stress-ink); }
.pill.hrv { background: var(--hrv-bg); color: var(--hrv-ink); }
.pill.claude { background: var(--claude-bg-2); color: var(--claude); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { min-height: 36px; border: 0; border-radius: 999px; background: transparent; font-size: calc(13.5 * var(--fs)); font-weight: 750; color: var(--muted); white-space: nowrap; padding: 0 8px; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: inset 0 1px 0 var(--hi), 0 2px 8px rgba(0, 0, 0, 0.22); }
.seg.solid button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg.small button { min-height: 30px; font-size: calc(12.5 * var(--fs)); }

/* ---------- week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.week button { border: 0; background: transparent; border-radius: 16px; padding: 7px 0 8px; display: grid; justify-items: center; gap: 1px; color: var(--ink); transition: background 0.2s; }
.week .wd { font-size: calc(11.5 * var(--fs)); font-weight: 750; color: var(--muted); }
.week .dn { font-family: var(--font-num); font-size: calc(20 * var(--fs)); font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.2; }
.week .dt { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.week button[aria-current="date"] { background: var(--accent); color: var(--on-accent); }
.week button[aria-current="date"] .wd { color: inherit; opacity: 0.65; }
.week button:disabled { opacity: 0.32; cursor: default; }

/* ---------- score rings ---------- */
.ring { position: relative; display: grid; place-items: center; flex: none; }
.ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring-track { stroke: var(--track); }
.ring-target { stroke: var(--go); opacity: 0.9; }
.ring-arc.draw, .ring-glow.draw { animation: ringDraw 1.15s var(--ease) 0.05s both; }
@keyframes ringDraw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
.ring-glow { opacity: var(--glow); }
.ring-in { position: relative; display: grid; justify-items: center; text-align: center; line-height: 1; }
.ring-v { font-size: calc(28 * var(--fs)); font-weight: 750; letter-spacing: -0.03em; }
.ring-v small { font-size: 0.5em; font-weight: 750; margin-left: 1px; letter-spacing: 0; }
.ring-u { font-size: calc(11 * var(--fs)); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.ring-s { font-size: calc(12 * var(--fs)); font-weight: 750; margin-top: 4px; }
.ring:not(.hero) .ring-v.long { font-size: calc(24 * var(--fs)); letter-spacing: -0.04em; }
.ring.hero .ring-v { font-size: calc(56 * var(--fs)); }
.ring.hero .ring-u { font-size: calc(12 * var(--fs)); }
.ring.hero .ring-s { font-size: calc(14 * var(--fs)); }
.scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.score {
  border: 0; border-radius: var(--r-lg); background: var(--surface); color: var(--ink); padding: 14px 6px 12px; display: grid; justify-items: center; gap: 8px;
  box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), var(--card-shadow); transition: transform 0.14s var(--ease); min-width: 0;
}
.score .nm { font-size: calc(14.5 * var(--fs)); font-weight: 800; }
.score .sb { font-size: calc(12 * var(--fs)); font-weight: 700; color: var(--muted); margin-top: -6px; white-space: nowrap; }
.hero-score { display: grid; justify-items: center; gap: 12px; text-align: center; padding: 6px 0 2px; }
.hero-score .when { font-size: calc(13 * var(--fs)); font-weight: 700; color: var(--muted); }
.hero-score p.lead { font-size: calc(16 * var(--fs)); line-height: 1.45; max-width: 34ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: calc(12.5 * var(--fs)); font-weight: 650; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend i.ln { width: 14px; height: 3px; border-radius: 2px; }
.legend i.dot { border-radius: 50%; }

/* ---------- rows: icon, text, value ---------- */
.prow { display: flex; align-items: center; gap: 12px; padding-block: 12px; min-width: 0; width: 100%; border: 0; background: none; color: inherit; text-align: left; }
.prow .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink-2); }
.prow .ic svg { width: 20px; height: 20px; }
.ic.strain { background: var(--strain-bg); color: var(--strain-ink); }
.ic.sleep { background: var(--sleep-bg); color: var(--sleep-ink); }
.ic.food { background: var(--food-bg); color: var(--food-ink); }
.ic.stress { background: var(--stress-bg); color: var(--stress-ink); }
.ic.hr { background: var(--hr-bg); color: var(--hr-ink); }
.ic.claude { background: var(--claude-bg-2); color: var(--claude); }
.ic.good { background: var(--good-bg); color: var(--good-ink); }
.prow .tx { flex: 1; min-width: 0; }
.prow .t { font-size: calc(15.5 * var(--fs)); font-weight: 750; line-height: 1.3; }
.prow .s { font-size: calc(13 * var(--fs)); color: var(--muted); line-height: 1.4; margin-top: 2px; }
.prow .rt { flex: none; display: flex; align-items: center; gap: 6px; text-align: right; }
.prow .rt > svg { width: 18px; height: 18px; color: var(--faint); }
.prow .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(18 * var(--fs)); font-weight: 750; }
.prow .val small { font-family: var(--font); font-size: calc(12 * var(--fs)); color: var(--muted); font-weight: 650; margin-left: 2px; }

/* ---------- timeline ---------- */
.tl { display: grid; }
.tl-row { display: grid; grid-template-columns: 46px 18px minmax(0, 1fr) auto; column-gap: 10px; align-items: start; padding-block: 8px; position: relative; border: 0; background: none; color: inherit; text-align: left; width: 100%; }
.tl-row .tm { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(14 * var(--fs)); font-weight: 650; color: var(--muted); padding-top: 1px; }
.tl-row .rail { position: relative; align-self: stretch; display: grid; justify-items: center; }
.tl-row .rail::before { content: ""; position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--line); left: calc(50% - 1px); }
.tl-row:first-child .rail::before { top: 10px; }
.tl-row:last-child .rail::before { bottom: calc(100% - 12px); }
.tl-row .rail i { position: relative; width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--c, var(--ink-2)); box-shadow: 0 0 0 3px var(--surface); }
.tl-row .rail i.hollow { background: var(--surface); box-shadow: inset 0 0 0 2.5px var(--c), 0 0 0 3px var(--surface); }
.tl-row .t { font-size: calc(15.5 * var(--fs)); font-weight: 750; line-height: 1.3; }
.tl-row .s { font-size: calc(13 * var(--fs)); color: var(--muted); line-height: 1.35; margin-top: 1px; }
.tl-row .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(16 * var(--fs)); font-weight: 700; padding-top: 1px; white-space: nowrap; }
.tl-row .v.badge { font-size: calc(14 * var(--fs)); padding: 2px 8px; border-radius: 8px; }
.tl-row.now .tm { color: var(--ink); font-weight: 800; }
.tl-row.now .rail i { width: 14px; height: 14px; margin-top: 3px; background: var(--hr); box-shadow: 0 0 0 3px var(--surface), 0 0 0 7px var(--hr-bg); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--hr-bg); } 50% { box-shadow: 0 0 0 3px var(--surface), 0 0 0 9px transparent; } }
.live-tag { display: inline-flex; align-items: center; gap: 6px; font-size: calc(11 * var(--fs)); font-weight: 850; letter-spacing: 0.08em; color: var(--hr-ink); }
.live-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--hr); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.35; } }

/* ---------- metric tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mtile { position: relative; border: 0; text-align: left; color: inherit; background: var(--surface); border-radius: var(--r-lg); padding: 14px 14px 12px; display: grid; gap: 2px; overflow: hidden; min-width: 0;
  box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), var(--card-shadow); }
.mtile .k { font-size: calc(13 * var(--fs)); font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtile .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(30 * var(--fs)); font-weight: 750; line-height: 1.12; letter-spacing: -0.02em; white-space: nowrap; }
.mtile .v small { font-family: var(--font); font-size: calc(13 * var(--fs)); font-weight: 650; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.mtile .d { font-size: calc(12.5 * var(--fs)); font-weight: 750; color: var(--muted); padding-right: 60px; line-height: 1.35; min-height: 17px; }
.mtile .spark { position: absolute; right: 12px; bottom: 12px; width: 58px; height: 24px; }
.tile2 { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.tile2 .k { font-size: calc(12 * var(--fs)); font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile2 .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(22 * var(--fs)); font-weight: 750; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile2 .v small { font-family: var(--font); font-size: calc(12 * var(--fs)); font-weight: 650; color: var(--muted); margin-left: 2px; }
.tile2 .d { font-size: calc(11.5 * var(--fs)); font-weight: 650; color: var(--muted); margin-top: 1px; }

/* ---------- meters, stacks, range bars ---------- */
.meter { position: relative; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--c) 18%, var(--surface-3)); }
.meter-fill { height: 100%; border-radius: 999px; background: var(--c); }
.meter-fill.over { background: repeating-linear-gradient(135deg, var(--c) 0 6px, color-mix(in srgb, var(--c) 62%, var(--ink)) 6px 9px); }
.stack { display: flex; gap: 2px; border-radius: 999px; overflow: hidden; }
.rangebar { position: relative; height: 8px; border-radius: 999px; background: var(--surface-3); margin-block: 8px 6px; }
.rangebar .nb { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: var(--raise); }
.rangebar .mk { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--ink-2); box-shadow: 0 0 0 3px var(--surface); }
.rangebar .mk.low, .rangebar .mk.bad { background: var(--crit); }
.rangebar .mk.good { background: var(--good); }
.vrow { padding-block: 12px; }
.vrow + .vrow { border-top: 1px solid var(--line); }
.vrow .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.vrow .top b { font-size: calc(15.5 * var(--fs)); font-weight: 750; }
.vrow .top .num { font-size: calc(20 * var(--fs)); font-weight: 750; }
.vrow .top .num small { font-family: var(--font); font-size: calc(12.5 * var(--fs)); color: var(--muted); font-weight: 600; margin-left: 3px; }
.vrow .lohi { display: flex; justify-content: space-between; gap: 10px; font-size: calc(12.5 * var(--fs)); font-weight: 700; }
.vrow .lohi span:last-child { color: var(--muted); font-weight: 600; }
.comp-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 34px; gap: 12px; align-items: center; padding-block: 9px; font-size: calc(14.5 * var(--fs)); font-weight: 700; }
.comp-row .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; font-weight: 750; }
.zone-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 54px; gap: 12px; align-items: center; padding-block: 6px; font-size: calc(13.5 * var(--fs)); }
.zone-row .z { font-weight: 750; }
.zone-row .m { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; }
.diverge { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); }
.diverge::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; background: var(--axis); }
.diverge-bar { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
.diverge-bar.neg { background: var(--younger); }
.diverge-bar.pos { background: var(--older); }
.diverge-bar.goodside { background: var(--strain); }
.diverge-bar.badside { background: var(--stress); }
.factor { display: grid; grid-template-columns: minmax(0, 1fr) 96px 48px; gap: 12px; align-items: center; padding-block: 10px; }
.factor + .factor { border-top: 1px solid var(--line); }
.factor b { display: block; font-size: calc(14.5 * var(--fs)); font-weight: 750; }
.factor span { display: block; font-size: calc(12 * var(--fs)); color: var(--muted); }
.factor .y { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(16 * var(--fs)); font-weight: 750; }

/* ---------- charts ---------- */
.chart { position: relative; outline: none; }
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 8px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .grid.dash { stroke-dasharray: 3 4; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .ref { stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 4 4; }
.chart .ref-label, .chart .level { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.chart .band { fill: var(--ink); opacity: 0.06; }
.chart .band-hrv { fill: var(--hrv); opacity: 0.14; }
.chart .shade-sleep, .chart .shade-nap { fill: var(--shade-sleep); }
.chart .shade-active { fill: var(--shade-active); }
.chart .shade-act { fill: var(--shade-act); }
.chart .act-line { fill: var(--act-line); }
.chart .shade-label { font-family: var(--font); font-size: calc(11 * var(--fs)); font-weight: 750; fill: var(--ink-2); }
.chart .tick { font-family: var(--font); font-size: calc(11 * var(--fs)); font-weight: 600; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .tick.strong { fill: var(--ink-2); font-weight: 750; }
.chart .now { stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 2 3; opacity: 0.7; }
.chart .cross { stroke: var(--ink-2); stroke-width: 1; }
.chart .bar { transition: opacity 0.15s; }
.chart .bar.dim { opacity: 0.35; }
.chart .bar-empty { fill: var(--track); }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .hyp-track { fill: var(--surface-2); }
.chart-empty { display: grid; place-items: center; color: var(--muted); font-size: calc(13 * var(--fs)); background: var(--surface-2); border-radius: var(--r-md); text-align: center; padding: 10px; }
.chart-label { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: calc(13.5 * var(--fs)); font-weight: 800; margin-bottom: 4px; }
.chart-label span:last-child { font-size: calc(12 * var(--fs)); font-weight: 600; color: var(--muted); }
.xlabels { display: flex; justify-content: space-between; font-size: calc(11 * var(--fs)); font-weight: 650; color: var(--muted); margin-top: 4px; }
.spark { display: block; overflow: visible; }
.tip {
  position: fixed; z-index: 95; pointer-events: none; padding: 7px 10px; border-radius: 12px; font-size: calc(12.5 * var(--fs)); line-height: 1.4; max-width: 230px;
  background: var(--glass-strong); color: var(--ink); box-shadow: inset 0 0 0 1px var(--glass-line), var(--shadow-sm); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.tip b { font-weight: 800; }

/* ---------- gauges, body map ---------- */
.gauges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.gauge-card { border: 0; text-align: left; color: inherit; background: var(--surface); border-radius: var(--r-lg); padding: 14px 12px 12px; display: grid; gap: 0; min-width: 0;
  box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), var(--card-shadow); }
.gauge-card .gt { display: flex; justify-content: space-between; align-items: center; font-size: calc(14.5 * var(--fs)); font-weight: 800; }
.gauge-card .gt svg { width: 17px; height: 17px; color: var(--faint); }
.gauge-card .gs { font-size: calc(19 * var(--fs)); font-weight: 800; letter-spacing: -0.01em; margin-top: 1px; }
.gauge-card .go { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: calc(12 * var(--fs)); font-weight: 700; color: var(--muted); }
.gauge-card .go i { width: 14px; height: 4px; border-radius: 2px; background: var(--go); }
.gauge-card .go b { color: var(--ink); font-weight: 800; }
.gauge { position: relative; width: 100%; max-width: 168px; margin: 2px auto 0; }
.gauge-svg { display: block; width: 100%; height: auto; overflow: visible; }
.gauge-svg .tick { font-family: var(--font); font-size: calc(11 * var(--fs)); font-weight: 650; fill: var(--muted); }
.gauge-opt { stroke: var(--go); opacity: 0.9; }
.gauge-dot { fill: var(--ink); }
.gauge-ticks.draw line { animation: tickIn 0.5s var(--ease) both; animation-delay: calc(var(--k) * 16ms); }
@keyframes tickIn { from { opacity: 0; } to { opacity: 1; } }
.gauge-in { position: absolute; left: 0; right: 0; top: 56%; transform: translateY(-50%); display: grid; justify-items: center; line-height: 1; }
.gauge-v { font-size: calc(30 * var(--fs)); font-weight: 750; letter-spacing: -0.02em; }
.gauge-s { font-size: calc(11 * var(--fs)); font-weight: 700; color: var(--muted); margin-top: 4px; }
.body-map { width: 100%; height: auto; display: block; }
.body-map .bm-neutral { fill: var(--surface-3); }
.body-map .bm-part { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.body-map .bm-label { font-size: calc(11 * var(--fs)); font-weight: 650; fill: var(--muted); font-family: var(--font); }

/* ---------- Today ---------- */
.focus h3 { font-size: calc(21 * var(--fs)); font-weight: 800; letter-spacing: -0.015em; line-height: 1.25; margin-top: 8px; }
.focus p { font-size: calc(15 * var(--fs)); line-height: 1.55; color: var(--ink-2); margin-top: 8px; }
.focus .chips { margin-top: 14px; }
.focus .chips:not(.wrap) { margin-inline: -18px; padding-inline: 18px; }
.done-tag { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding-inline: 10px; border-radius: 999px; background: var(--good-bg); color: var(--good-ink); font-size: calc(13 * var(--fs)); font-weight: 800; }
.done-tag svg { width: 15px; height: 15px; }

/* ---------- training ---------- */
.ready-card .pills { display: flex; flex-wrap: wrap; gap: 6px; }
.ready-card h3 { font-size: calc(21 * var(--fs)); font-weight: 800; letter-spacing: -0.015em; line-height: 1.25; margin-top: 12px; }
.tomorrow { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; color: inherit; background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; margin-top: 14px; }
.tomorrow svg.body-map { width: 46px; flex: none; }
.tomorrow b { display: block; font-size: calc(15 * var(--fs)); font-weight: 800; color: var(--ink); }
.tomorrow .grow > span { display: block; font-size: calc(13 * var(--fs)); color: var(--muted); line-height: 1.4; }
.tomorrow > svg:last-child { width: 18px; height: 18px; color: var(--faint); flex: none; }
.routine-card .eyebrow { color: var(--good-ink); }
.routine-card h3 { font-size: calc(24 * var(--fs)); font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
.routine-card .meta { font-size: calc(13 * var(--fs)); color: var(--muted); margin-top: 2px; }
.ex-lines { display: grid; gap: 6px; margin: 14px 0 16px; }
.ex-lines div { display: flex; justify-content: space-between; gap: 12px; font-size: calc(14.5 * var(--fs)); }
.ex-lines div span:first-child { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-lines div span:last-child { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.routines { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; scroll-snap-type: x mandatory; }
.routines::-webkit-scrollbar { display: none; }
.rcard { flex: none; width: 152px; border: 0; text-align: left; color: inherit; background: var(--surface); border-radius: var(--r-lg); padding: 14px 12px; display: grid; gap: 2px; scroll-snap-align: start;
  box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), var(--card-shadow); }
.rcard .t { font-size: calc(15.5 * var(--fs)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard .s { font-size: calc(12.5 * var(--fs)); color: var(--muted); }
.rcard .st { display: flex; align-items: center; gap: 6px; font-size: calc(12.5 * var(--fs)); font-weight: 750; margin-top: 8px; }
.rcard.new { display: grid; place-items: center; color: var(--ink-2); font-weight: 750; box-shadow: inset 0 0 0 1.5px var(--line); background: transparent; }
.rcard.new svg { width: 22px; height: 22px; }
.wk7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wk7 > div { display: grid; justify-items: center; gap: 4px; }
.wk7 .dl { font-size: calc(11 * var(--fs)); font-weight: 750; color: var(--muted); }
.wk7 .bx { width: 100%; aspect-ratio: 1 / 1.06; max-width: 46px; border-radius: 12px; display: grid; place-items: center; font-size: calc(11 * var(--fs)); font-weight: 800; background: var(--surface-2); color: var(--muted); }
.wk7 .bx.str { background: var(--hrv-bg); color: var(--hrv-ink); }
.wk7 .bx.car { background: var(--strain-bg); color: var(--strain-ink); }
.wk7 .bx.today { box-shadow: inset 0 0 0 2px var(--ink-2); }
.wk7 .bx.future { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.wk7 .sv { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(13 * var(--fs)); font-weight: 750; color: var(--ink-2); }

/* ---------- workout logger ---------- */
.wk-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; margin-inline: -16px; padding: 10px 16px 10px; background: color-mix(in srgb, var(--bg) 78%, transparent);
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); box-shadow: 0 1px 0 var(--line); }
.wk-top { display: flex; align-items: center; gap: 10px; }
.wk-top .mid { flex: 1; min-width: 0; text-align: center; }
.wk-top .mid input { width: 100%; border: 0; background: transparent; text-align: center; font-size: calc(17 * var(--fs)); font-weight: 800; color: var(--ink); padding: 0; }
.wk-top .mid input:focus { outline: none; text-decoration: underline; text-decoration-color: var(--axis); }
.wk-top .mid .num { font-size: calc(14 * var(--fs)); color: var(--muted); font-weight: 650; white-space: nowrap; }
.wk-progress { height: 4px; border-radius: 2px; background: var(--surface-3); margin-top: 10px; overflow: hidden; }
.wk-progress div { height: 100%; border-radius: 2px; background: var(--go); transition: width 0.35s var(--ease); }
.ex-card { background: var(--surface); border-radius: var(--r-lg); padding: 12px; display: grid; gap: 8px; box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), var(--card-shadow); min-width: 0; }
.ex-card.ss { background: linear-gradient(var(--warn-bg), var(--warn-bg)), var(--surface); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent); }
.ss-label { display: flex; align-items: center; gap: 8px; font-size: calc(11.5 * var(--fs)); font-weight: 850; letter-spacing: 0.05em; color: var(--warn-ink); text-transform: uppercase; }
.ss-label svg { width: 16px; height: 16px; }
.ex-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ex-head .nm { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; font-size: calc(17 * var(--fs)); font-weight: 800; color: var(--strain-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-head .tag { font-family: var(--font-num); display: inline-grid; place-items: center; width: 30px; height: 24px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); font-size: calc(13 * var(--fs)); font-weight: 800; flex: none; }
.mini-btn { border: 0; height: 34px; padding-inline: 10px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-size: calc(13 * var(--fs)); font-weight: 750; display: inline-flex; align-items: center; gap: 5px; flex: none; white-space: nowrap; }
.mini-btn svg { width: 15px; height: 15px; }
.mini-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.hint-box { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-radius: 12px; background: var(--hrv-bg); color: var(--hrv-ink); font-size: calc(13 * var(--fs)); line-height: 1.45; }
.hint-box svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.set-grid { display: grid; gap: 4px; }
.set-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 60px 50px 42px 44px; gap: 6px; align-items: center; min-height: 46px; padding: 0 2px; border-radius: 12px; transition: background 0.25s; }
.set-row.head { min-height: 0; font-size: calc(11 * var(--fs)); font-weight: 850; letter-spacing: 0.05em; color: var(--muted); }
.set-row.head span { text-align: center; }
.set-row.head span:nth-child(2) { text-align: left; }
.set-row.done { background: var(--good-bg); }
.set-type { height: 34px; border: 0; border-radius: 10px; background: var(--surface-3); color: var(--ink); font-family: var(--font-num); font-size: calc(15 * var(--fs)); font-weight: 800; }
.set-type.W { background: var(--warn-bg); color: var(--warn-ink); }
.set-type.D { background: var(--strain-bg); color: var(--strain-ink); }
.set-type.F { background: var(--crit-bg); color: var(--crit-ink); }
.set-prev { border: 0; background: none; padding: 0; text-align: left; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(14.5 * var(--fs)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 40px; }
.set-in { width: 100%; height: 40px; border: 0; border-radius: 10px; background: var(--surface-3); color: var(--ink); text-align: center; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(17 * var(--fs)); font-weight: 750; padding: 0 2px; -moz-appearance: textfield; }
.set-in::placeholder { color: var(--faint); }
.set-in.rpe { font-size: calc(15 * var(--fs)); color: var(--ink-2); }
.set-in:focus { outline: 2px solid var(--strain); outline-offset: -2px; }
.set-row.done .set-in { background: transparent; }
.set-ok { height: 40px; border: 0; border-radius: 10px; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; transition: background 0.2s, color 0.2s, transform 0.12s; }
.set-ok svg { width: 20px; height: 20px; stroke-width: 2.6; }
.set-ok[aria-pressed="true"] { background: var(--go); color: var(--on-go); animation: pop 0.32s var(--spring); }
@keyframes pop { 0% { transform: scale(0.82); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
.set-row.done { animation: rowDone 0.5s ease-out; }
@keyframes rowDone { from { background: color-mix(in srgb, var(--go) 35%, transparent); } }
.add-set { height: 40px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: calc(14 * var(--fs)); font-weight: 750; }
.plates { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; background: var(--surface-2); font-size: calc(13 * var(--fs)); line-height: 1.45; }
.plates svg { flex: none; }
.plates b { font-weight: 800; }
.rest-bar, .wk-bar, .plate-bar, .composer-wrap {
  position: fixed; z-index: 45; left: 12px; right: 12px; max-width: 536px; margin-inline: auto;
  bottom: calc(var(--dock-h) + 20px + env(safe-area-inset-bottom, 0px));
}
#app.flow ~ #float .rest-bar, #app.flow .plate-bar, #app.flow .composer-wrap { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.rest-bar { border-radius: 26px; background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--glass-line), var(--shadow); -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8); overflow: hidden; animation: barIn 0.38s var(--spring) both; }
@keyframes barIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.rest-bar .tr { height: 4px; background: var(--track); }
.rest-bar .tr div { height: 100%; background: var(--strain); transition: width 1s linear; }
.rest-bar .bd { padding: 12px 14px 14px; display: grid; gap: 10px; }
.rest-bar .lb { font-size: calc(11.5 * var(--fs)); font-weight: 850; letter-spacing: 0.08em; color: var(--strain-ink); }
.rest-bar .tm { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(40 * var(--fs)); font-weight: 750; line-height: 1; letter-spacing: -0.02em; }
.rest-bar .nx { flex: 1; min-width: 0; font-size: calc(13 * var(--fs)); line-height: 1.4; color: var(--ink-2); }
.rest-bar .nx b { display: block; color: var(--ink); font-weight: 800; }
.rest-bar .btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rest-bar .btns .btn { height: 44px; }
.wk-bar { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line), var(--shadow-sm); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8); animation: barIn 0.38s var(--spring) both; }
.wk-bar { padding-left: 16px; border: 0; color: inherit; text-align: left; width: auto; }
.wk-bar .tx { flex: 1; min-width: 0; }
.wk-bar .t { font-size: calc(14.5 * var(--fs)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-bar .s { font-size: calc(12.5 * var(--fs)); color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.wk-bar .go { height: 42px; padding-inline: 16px; border-radius: 999px; background: var(--go); color: var(--on-go); font-weight: 800; font-size: calc(14 * var(--fs)); display: inline-flex; align-items: center; gap: 6px; }
.wk-bar .go svg { width: 16px; height: 16px; }

/* ---------- food ---------- */
.left-card .row.base { justify-content: space-between; flex-wrap: wrap; row-gap: 8px; }
.macro-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.macro .nm { display: flex; align-items: center; gap: 6px; font-size: calc(13 * var(--fs)); font-weight: 750; }
.macro .nm i { width: 8px; height: 8px; border-radius: 50%; }
.macro .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(22 * var(--fs)); font-weight: 750; margin-top: 2px; line-height: 1.15; }
.macro { min-width: 0; }
.macro .v small { font-family: var(--font); font-size: calc(12 * var(--fs)); color: var(--muted); font-weight: 650; margin-left: 2px; }
.macro .meter { margin-block: 6px 4px; }
.macro .of { font-size: calc(11.5 * var(--fs)); font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }
.picks { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; scroll-snap-type: x mandatory; }
.picks::-webkit-scrollbar { display: none; }
.pick { flex: none; width: 168px; border-radius: var(--r-lg); background: var(--surface); padding: 14px 12px 12px; display: grid; gap: 4px; scroll-snap-align: start;
  box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), var(--card-shadow); }
.pick .t { font-size: calc(15 * var(--fs)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .s { font-size: calc(12.5 * var(--fs)); color: var(--muted); margin-bottom: 8px; }
.pick .btn { height: 38px; font-size: calc(13.5 * var(--fs)); }
.meal + .meal { border-top: 1px solid var(--line); }
.meal-head { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: inherit; text-align: left; padding: 13px 0; }
.meal-head .tx { flex: 1; min-width: 0; }
.meal-head .nm { font-size: calc(16.5 * var(--fs)); font-weight: 800; }
.meal-head .nm span { font-family: var(--font-num); font-size: calc(13.5 * var(--fs)); font-weight: 650; color: var(--muted); margin-left: 6px; }
.meal-head .sm { font-size: calc(13 * var(--fs)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meal-head .kc { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(19 * var(--fs)); font-weight: 750; }
.meal-head .tg { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); flex: none; transition: transform 0.25s var(--ease); }
.meal-head .tg svg { width: 18px; height: 18px; }
.meal[aria-expanded="true"] .tg { transform: rotate(180deg); }
.meal-body { display: grid; gap: 6px; padding-bottom: 12px; }
.meal-body > * { min-width: 0; }
.food-li { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; text-align: left; color: inherit; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.food-li .tx { flex: 1; min-width: 0; }
.food-li .t { font-size: calc(14.5 * var(--fs)); font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.food-li .s { font-size: calc(12.5 * var(--fs)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.food-li .kc { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(16 * var(--fs)); font-weight: 700; }
.add-line { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--food-ink); font-size: calc(14 * var(--fs)); font-weight: 800; padding: 8px 0 4px; }
.add-line svg { width: 16px; height: 16px; }
.flow-top { display: flex; align-items: center; gap: 12px; padding-top: 10px; }
.flow-top .tx { flex: 1; min-width: 0; }
.flow-top .lbl { font-size: calc(12.5 * var(--fs)); font-weight: 700; color: var(--muted); }
.meal-pick { border: 0; background: none; padding: 0; color: var(--ink); display: inline-flex; align-items: baseline; gap: 8px; font-size: calc(21 * var(--fs)); font-weight: 800; position: relative; }
.meal-pick .num { font-size: calc(15 * var(--fs)); color: var(--muted); font-weight: 650; }
.meal-pick svg { width: 16px; height: 16px; align-self: center; color: var(--muted); }
.meal-pick select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.searchbox { position: relative; }
.searchbox svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--muted); pointer-events: none; }
.searchbox .input { padding-left: 44px; height: 52px; border-radius: 18px; font-size: calc(16.5 * var(--fs)); }
.res { display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 14px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), var(--card-shadow); }
.res .tx { flex: 1; min-width: 0; border: 0; background: none; color: inherit; text-align: left; padding: 0; }
.res .t { font-size: calc(15.5 * var(--fs)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .s { font-size: calc(12.5 * var(--fs)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .kc { text-align: right; flex: none; }
.res .kc b { display: block; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(17 * var(--fs)); font-weight: 750; }
.res .kc span { font-size: calc(11.5 * var(--fs)); font-weight: 800; color: var(--food-ink); }
.add-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-family: var(--font-num); font-weight: 800; font-size: calc(15 * var(--fs)); transition: transform 0.12s var(--ease), background 0.2s; }
.add-btn svg { width: 18px; height: 18px; stroke-width: 2.4; }
.add-btn.on { background: var(--food-bg); color: var(--food-ink); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--food-ink) 45%, transparent); }
.plate-bar { border-radius: 26px; padding: 12px; background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--glass-line), var(--shadow); -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8); display: grid; gap: 10px; animation: barIn 0.38s var(--spring) both; }
.plate-sum { display: flex; align-items: center; gap: 12px; }
.plate-sum .cnt { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--food-bg); color: var(--food-ink); font-family: var(--font-num); font-size: calc(18 * var(--fs)); font-weight: 800; flex: none; }
.plate-sum .t { font-size: calc(15 * var(--fs)); font-weight: 800; }
.plate-sum .t .num { font-size: calc(17 * var(--fs)); }
.plate-sum .s { font-size: calc(12.5 * var(--fs)); font-weight: 750; }
.plate-sum .s.over { color: var(--warn-ink); }
.plate-sum .s.ok { color: var(--good-ink); }
.plate-list { display: grid; gap: 6px; max-height: 34vh; overflow: auto; }
.plate-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--surface-2); font-size: calc(14 * var(--fs)); }
.plate-item .grow b { display: block; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate-item .grow span { font-size: calc(12 * var(--fs)); color: var(--muted); }
.qty { display: inline-flex; align-items: center; border-radius: 999px; background: var(--surface-3); flex: none; }
.qty button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; font-size: calc(18 * var(--fs)); font-weight: 700; color: var(--ink); }
.qty span { min-width: 40px; text-align: center; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(14 * var(--fs)); font-weight: 750; }
.scan-view { display: grid; gap: 14px; }
.scan-view .frame { position: relative; aspect-ratio: 1 / 0.85; border-radius: 24px; background: radial-gradient(circle at 50% 40%, var(--surface-3), var(--surface)); display: grid; place-items: center; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.scan-view .frame::before, .scan-view .frame::after { content: ""; position: absolute; inset: 22% 14%; border-radius: 18px; border: 2.5px solid color-mix(in srgb, var(--ink) 70%, transparent); clip-path: polygon(0 0, 22% 0, 22% 100%, 78% 100%, 78% 0, 100% 0, 100% 22%, 0 22%, 0 78%, 100% 78%, 100% 100%, 0 100%); }
.scan-view .frame::after { inset: 49.6% 18%; border: 0; height: 2px; background: var(--hr); border-radius: 2px; clip-path: none; box-shadow: 0 0 12px var(--hr); animation: scanline 2.2s ease-in-out infinite; }
@keyframes scanline { 0%, 100% { transform: translateY(-46px); } 50% { transform: translateY(46px); } }
.scan-view .frame p { position: relative; z-index: 1; max-width: 24ch; text-align: center; font-size: calc(13.5 * var(--fs)); color: var(--ink-2); font-weight: 600; margin-top: 140px; }
.est-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding-block: 11px; align-items: center; }
.est-item + .est-item { border-top: 1px solid var(--line); }
.est-item .nm { font-weight: 750; }
.est-item .mac { font-size: calc(12.5 * var(--fs)); color: var(--muted); grid-column: 1; }
.est-item .ctl { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 6px; }
.photo-prev { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--r-md); display: block; }
.nutri { display: grid; }
.nutri .kv:first-child { font-size: calc(17 * var(--fs)); }

/* ---------- check-in ---------- */
.feel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.feel button { border: 0; min-height: 60px; border-radius: 16px; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; align-content: center; gap: 3px; transition: background 0.2s, color 0.2s, transform 0.12s; }
.feel button .num { font-size: calc(20 * var(--fs)); font-weight: 750; line-height: 1; }
.feel button span:last-child { font-size: calc(11 * var(--fs)); font-weight: 750; }
.feel button[aria-pressed="true"] { background: var(--sleep); color: #fff; }
.habit-q { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.habit-q + .habit-q, .habit-q + .amount + .habit-q { border-top: 1px solid var(--line); }
.habit-q .tx { flex: 1; min-width: 0; }
.habit-q b { display: block; font-size: calc(15.5 * var(--fs)); font-weight: 750; }
.habit-q span { display: block; font-size: calc(12.5 * var(--fs)); color: var(--muted); margin-top: 1px; }
.yn { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); flex: none; }
.yn button { width: 56px; min-height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-size: calc(14 * var(--fs)); font-weight: 800; transition: background 0.2s, color 0.2s; }
.yn button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.amount { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--surface-2); margin-bottom: 12px; }
.amount > span { font-size: calc(14 * var(--fs)); font-weight: 650; color: var(--ink-2); }
.progress { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress > div { height: 100%; border-radius: 999px; background: var(--sleep); transition: width 0.3s var(--ease); }
.stickyfoot { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; padding-top: 18px; background: linear-gradient(transparent, var(--bg) 40%); margin-inline: -16px; padding-inline: 16px; }

/* ---------- Claude ---------- */
.ctx-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: calc(12.5 * var(--fs)); font-weight: 700; color: var(--muted); }
.ctx-chips span.c { height: 28px; display: inline-flex; align-items: center; padding-inline: 10px; border-radius: 999px; background: var(--claude-bg-2); color: var(--ink); font-weight: 750; }
.ctx-chips span.c.plain { background: var(--surface-2); }
.chat { display: grid; gap: 16px; padding-top: 4px; }
.msg { max-width: 100%; font-size: calc(15.5 * var(--fs)); line-height: 1.6; overflow-wrap: anywhere; }
.msg.me { justify-self: end; max-width: 86%; padding: 10px 14px; border-radius: 20px 20px 6px 20px; background: var(--accent); color: var(--on-accent); font-weight: 650; line-height: 1.45; }
.msg.ai p + p, .msg.ai ul, .msg.ai ol { margin-top: 10px; }
.msg.ai ul, .msg.ai ol { padding-left: 22px; margin-bottom: 0; }
.msg.ai li + li { margin-top: 6px; }
.msg.ai strong { font-weight: 800; }
.msg.thinking { color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.msg.thinking::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--claude); border-right-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.prompts { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.prompts::-webkit-scrollbar { display: none; }
.composer-wrap { display: grid; gap: 4px; }
.composer { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 28px; background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--glass-line), var(--shadow-sm); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; font-size: calc(16 * var(--fs)); line-height: 1.4; padding: 11px 0; max-height: 140px; color: var(--ink); }
.composer textarea:focus { outline: none; }
.composer .btn { width: 44px; height: 44px; padding: 0; flex: none; }
/* starting points stack instead of hiding in a sideways row */
.prompts.stack { display: grid; gap: 6px; overflow: visible; }
.prompt { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 14px; border: 0; border-radius: 16px; background: var(--claude-bg-2); color: var(--ink); text-align: left; font-size: calc(14.5 * var(--fs)); font-weight: 700; line-height: 1.35; }
.prompt svg { width: 16px; height: 16px; flex: none; color: var(--claude); }
/* an action Claude proposes: what it does, then Confirm or Dismiss */
.card.act-card { display: grid; gap: 10px; padding: 14px 16px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--claude) 40%, transparent); }
.act-card .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink-2); }
.act-card .ic svg { width: 18px; height: 18px; }
.act-card b { font-size: calc(15 * var(--fs)); font-weight: 800; line-height: 1.3; }
.act-lines { display: grid; gap: 4px; }
.act-lines > div { display: flex; justify-content: space-between; gap: 10px; font-size: calc(13.5 * var(--fs)); color: var(--ink-2); }
.act-lines > div > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.act-lines .num { flex: none; color: var(--muted); font-weight: 700; }
.act-btns { display: flex; justify-content: flex-end; gap: 8px; }
.act-state { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: calc(13.5 * var(--fs)); font-weight: 750; color: var(--muted); }
.act-state > span { display: inline-flex; align-items: center; gap: 6px; }
.act-state svg { width: 16px; height: 16px; }
.act-state.done > span { color: var(--good-ink); }
.act-state.invalid > span { color: var(--crit-ink); }
.card.chart-card { padding: 14px 16px; }
.mem-row { display: flex; align-items: flex-start; gap: 6px; padding-block: 6px; }
.mem-row .input { flex: 1; min-width: 0; resize: vertical; min-height: 44px; }

/* ---------- sheets ---------- */
.sheet-scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; transition: opacity 0.3s; }
.sheet-scrim.in { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; margin-inline: auto; max-width: 560px;
  background: var(--glass-strong); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: inset 0 1px 0 var(--glass-line), var(--shadow);
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform 0.42s var(--spring);
}
.sheet.in { transform: none; }
.sheet:focus { outline: none; }
.sheet.full { height: calc(100% - 24px - env(safe-area-inset-top, 0px)); }
.grab { width: 38px; height: 5px; border-radius: 99px; background: var(--axis); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px 6px 20px; flex: none; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: calc(22 * var(--fs)); font-weight: 800; letter-spacing: -0.015em; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 20px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; overscroll-behavior: contain; }
.sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; flex: none; }
.sheet-foot .btn { flex: 1; }
.add-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.add-tile { border: 0; min-height: 92px; border-radius: 20px; background: var(--surface-2); color: var(--ink); padding: 12px; display: grid; align-content: space-between; justify-items: start; gap: 10px; text-align: left; font-size: calc(14.5 * var(--fs)); font-weight: 750; line-height: 1.25; transition: transform 0.12s var(--ease); }
.add-tile .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); }
.add-tile .ic svg { width: 19px; height: 19px; }
.say { display: flex; align-items: center; gap: 10px; height: 52px; border-radius: 18px; padding: 0 6px 0 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.say > svg { width: 19px; height: 19px; color: var(--claude); flex: none; }
.say input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: calc(16 * var(--fs)); color: var(--ink); }
.say input:focus { outline: none; }
.say input::placeholder { color: var(--muted); }
.say .btn { height: 40px; width: 40px; padding: 0; flex: none; }

/* ---------- forms ---------- */
.field { display: grid; gap: 7px; min-width: 0; }
.field > span, .field > label { font-size: calc(13.5 * var(--fs)); font-weight: 750; color: var(--ink-2); }
.field .hint { font-size: calc(12 * var(--fs)); color: var(--muted); font-weight: 500; }
.input, select.input, textarea.input {
  width: 100%; min-width: 0; height: 48px; padding-inline: 14px; border-radius: 14px; border: 0;
  background: var(--surface-2); color: var(--ink); font-size: calc(16 * var(--fs)); box-shadow: inset 0 0 0 1px var(--line);
}
textarea.input { height: auto; min-height: 96px; padding-block: 12px; resize: vertical; line-height: 1.45; }
.input:focus { outline: 2px solid var(--ink-2); outline-offset: -2px; }
.input::placeholder { color: var(--faint); }
.input-unit { position: relative; }
.input-unit .input { padding-right: 48px; }
.input-unit > em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: calc(14 * var(--fs)); pointer-events: none; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px; font-weight: 650; }
.switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 999px; background: var(--surface-3); position: relative; flex: none; cursor: pointer; transition: background 0.2s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); transition: transform 0.22s var(--spring); }
.switch input:checked { background: var(--go); }
.switch input:checked::after { transform: translateX(20px); }
.slider { width: 100%; accent-color: var(--ink); }
input[type="range"].slider { height: 32px; }
.steps-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: calc(14.5 * var(--fs)); color: var(--ink-2); }
.expander summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; font-size: calc(15.5 * var(--fs)); font-weight: 800; }
.expander summary::-webkit-details-marker { display: none; }
.expander summary svg { width: 18px; height: 18px; color: var(--muted); transition: transform 0.25s var(--ease); }
.expander[open] summary svg { transform: rotate(45deg); }
.expander .body { display: grid; gap: 10px; margin-top: 12px; font-size: calc(14.5 * var(--fs)); line-height: 1.55; color: var(--ink-2); }

/* ---------- Today: slim stress row, fold-away cards, habits row, next up ---------- */
.card.stress-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 18px; align-items: center; column-gap: 14px; padding: 12px 14px 12px 16px; }
.stress-row .tx { display: grid; min-width: 0; }
.stress-row .nm { display: flex; align-items: center; gap: 8px; font-size: calc(15.5 * var(--fs)); font-weight: 800; }
.stress-row .l { font-size: calc(13.5 * var(--fs)); font-weight: 800; }
.stress-row .s { font-size: calc(12 * var(--fs)); font-weight: 650; color: var(--muted); white-space: nowrap; }
.stress-row .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(30 * var(--fs)); font-weight: 750; letter-spacing: -0.02em; line-height: 1; }
.stress-row > svg:last-child { width: 18px; height: 18px; color: var(--faint); }
.stress-row .mini { display: block; width: 100%; height: 44px; overflow: visible; }
.card.fold { padding: 4px 6px 4px 16px; }
.fold-top { display: flex; align-items: center; gap: 8px; }
.fold-head { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px 6px 0; border: 0; background: none; color: inherit; text-align: left; }
.fold-head .tx { flex: 1; min-width: 0; display: grid; }
.fold-head .t { font-size: calc(16.5 * var(--fs)); font-weight: 800; letter-spacing: -0.01em; }
.fold-head .s { display: flex; align-items: center; gap: 8px; font-size: calc(13 * var(--fs)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fold-head .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.fold-head .ic svg { width: 20px; height: 20px; }
.fold .tg { width: 18px; height: 18px; color: var(--faint); flex: none; transition: transform 0.25s var(--ease); }
.fold-head[aria-expanded="true"] .tg, .fold-tg[aria-expanded="true"] .tg { transform: rotate(180deg); }
.fold-body { padding: 4px 10px 14px 0; }
.fold .tiles .mtile { background: var(--surface-2); box-shadow: none; }
.habits-row .fold-top > .btn { flex: none; }
.habits-row .fold-head .s { white-space: normal; }
.hdots { display: inline-flex; gap: 3px; flex: none; }
.hdots i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.4px var(--axis); }
.hdots i.on { background: var(--good); box-shadow: none; }
.hdots i.bad { background: var(--stress); box-shadow: none; border-radius: 2px; }
.focus .next { margin-top: 14px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--claude) 22%, transparent); }
.focus .next .eyebrow { margin-bottom: 2px; }
.focus .next .list > * + * { border-top-color: color-mix(in srgb, var(--ink) 8%, transparent); }
.focus .next .list + .list:not([hidden]) { border-top: 1px solid color-mix(in srgb, var(--ink) 8%, transparent); }
.focus .next .link svg { transition: transform 0.25s var(--ease); }
.focus .next .link[aria-expanded="true"] svg { transform: rotate(180deg); }
.focus .prow .ic { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.sample-pill { border: 0; height: 26px; background: var(--warn-bg); color: var(--warn-ink); }
.mini .lv { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 3; }
.mini .base { stroke: var(--axis); stroke-width: 1; }

/* ---------- training calendar ---------- */
.cal-nav { display: flex; align-items: center; gap: 0; margin-right: -6px; }
.cal-nav .icon-btn { width: 32px; height: 32px; background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.cal-nav .icon-btn svg { width: 17px; height: 17px; }
.cal-nav span { font-size: calc(13 * var(--fs)); font-weight: 750; color: var(--ink-2); min-width: 78px; text-align: center; white-space: nowrap; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal > button { border: 0; background: none; color: inherit; padding: 2px 0 4px; display: grid; justify-items: center; align-content: start; gap: 4px; border-radius: 14px; min-width: 0; transition: background 0.2s; }
.cal .dl { font-size: calc(11 * var(--fs)); font-weight: 750; color: var(--muted); }
.cal .dd { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(15 * var(--fs)); font-weight: 750; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.cal > button.is-today .dd { box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.cal > button[aria-pressed="true"] .dd { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.cal .bx { position: relative; width: 100%; max-width: 50px; min-height: 48px; border-radius: 12px; display: grid; place-items: center; align-content: center; gap: 1px; padding: 4px 2px; background: var(--surface-2); color: var(--faint);
  font-size: calc(11 * var(--fs)); font-weight: 800; line-height: 1.15; text-align: center; overflow: hidden; border: 1.5px solid transparent; }
.cal .bx.str { background: var(--hrv-bg); color: var(--hrv-ink); }
.cal .bx.car { background: var(--strain-bg); color: var(--strain-ink); }
.cal .bx.plan { background: transparent; border: 1.5px dashed color-mix(in srgb, var(--c) 70%, transparent); color: var(--c); }
.cal .bx.missed { background: transparent; border: 1.5px dashed var(--line); color: var(--faint); }
.cal .bx small { display: block; font-family: var(--font-num); font-size: calc(11 * var(--fs)); font-weight: 750; opacity: 0.85; }
.cal .bx .more { position: absolute; top: 2px; right: 3px; font-size: calc(11 * var(--fs)); font-weight: 850; opacity: 0.8; }
.cal .bx .tick { width: 13px; height: 13px; margin: 0 auto 1px; display: block; stroke-width: 2.8; }
.cal .sv { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: calc(12 * var(--fs)); font-weight: 750; color: var(--strain-ink); min-height: 16px; }
.cal-day { margin-top: 12px; padding-top: 4px; border-top: 1px solid var(--line); }
.cal-day .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 2px; }
.cal-day .hd b { font-size: calc(15 * var(--fs)); font-weight: 800; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: calc(12 * var(--fs)); font-weight: 800; white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.wkday { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-block: 10px; min-height: 58px; }
.wkday + .wkday { border-top: 1px solid var(--line); }
.wkday > b { font-size: calc(14 * var(--fs)); font-weight: 800; color: var(--ink-2); }
.wkday .items { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.plan-chip { border: 0; height: 34px; padding-inline: 10px 12px; border-radius: 11px; display: inline-flex; align-items: center; gap: 7px; font-size: calc(13.5 * var(--fs)); font-weight: 750; background: var(--surface-2); color: var(--ink); max-width: 100%; }
.plan-chip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.plan-chip span { font-family: var(--font-num); color: var(--muted); font-weight: 700; font-size: calc(12.5 * var(--fs)); }
.plan-chip b { font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.daypick button { height: 42px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: calc(13.5 * var(--fs)); font-weight: 800; box-shadow: inset 0 0 0 1px var(--line); }
.daypick button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }

/* ---------- baselines and factor groups (Health) ---------- */

  const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
  const range = (from, to) => { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) out.push(d); return out; };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clamp01 = (x) => clamp(x, 0, 1);
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const mean = (a) => (a.length ? sum(a) / a.length : null);
  const sd = (a) => {
    if (a.length < 2) return null;
    const m = mean(a);
    return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1));
  };
  const median = (a) => {
    if (!a.length) return null;
    const s = [...a].sort((x, y) => x - y), i = s.length >> 1;
    return s.length % 2 ? s[i] : (s[i - 1] + s[i]) / 2;
  };
  const round = (x, d = 0) => (x == null || !isFinite(x) ? null : Math.round(x * 10 ** d) / 10 ** d);
  const isNum = (x) => typeof x === 'number' && isFinite(x);
  const num = (x, dflt = 0) => { const n = typeof x === 'string' ? parseFloat(x.replace(',', '.')) : x; return isNum(n) ? n : dflt; };

  // "2026-10-09T23:41" -> minutes since midnight
  const minOfDay = (iso) => { const t = iso.slice(11, 16); return +t.slice(0, 2) * 60 + +t.slice(3, 5); };
  // minutes relative to noon (so 23:30 and 00:30 are 60 apart)
  const noonRel = (iso) => (minOfDay(iso) + 720) % 1440;
  const isoToDate = (iso) => new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10), +iso.slice(11, 13) || 0, +iso.slice(14, 16) || 0);
  const isoLocal = (d) => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const minutesBetween = (a, b) => Math.round((isoToDate(b) - isoToDate(a)) / 6e4);

  const fmtDur = (min) => {
    if (min == null) return '–';
    const m = Math.round(min);
    const h = Math.floor(m / 60), r = m % 60;
    return h ? `${h}h ${pad(r)}m` : `${r}m`;
  };
  /** Like fmtDur, but whole hours read as "11h" rather than "11h 00m". */
  const fmtHrs = (min) => (min != null && min >= 60 && Math.round(min) % 60 === 0 ? `${Math.round(min) / 60}h` : fmtDur(min));
  const fmtInt = (n) => (n == null ? '–' : Math.round(n).toLocaleString('en-US'));
  const fmt1 = (n) => (n == null ? '–' : (Math.round(n * 10) / 10).toFixed(1));
  const fmtSigned = (n, d = 0, unit = '') => {
    if (n == null) return '–';
    const v = round(n, d);
    return (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(d) + unit;
  };
  const fmtClock = (iso) => (iso ? iso.slice(11, 16) : '–');
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const wd = (s) => WD[parseYmd(s).getDay()];
  const fmtDay = (s) => { const d = parseYmd(s); return `${WD[d.getDay()]}, ${MO[d.getMonth()]} ${d.getDate()}`; };
  const fmtDayLong = (s) => { const d = parseYmd(s); return `${WDL[d.getDay()]}, ${MO[d.getMonth()]} ${d.getDate()}`; };
  const fmtShort = (s) => { const d = parseYmd(s); return `${MO[d.getMonth()]} ${d.getDate()}`; };

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const rng = (seed) => () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const gauss = (r) => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // units
  const KG_PER_LB = 0.45359237;
  const kgTo = (kg, units) => (kg == null ? null : units === 'imperial' ? kg / KG_PER_LB : kg);
  const toKg = (v, units) => (v == null ? null : units === 'imperial' ? v * KG_PER_LB : v);
  const wUnit = (units) => (units === 'imperial' ? 'lb' : 'kg');
  const cmTo = (cm, units) => (cm == null ? null : units === 'imperial' ? cm / 2.54 : cm);
  const toCm = (v, units) => (v == null ? null : units === 'imperial' ? v * 2.54 : v);
  const lUnit = (units) => (units === 'imperial' ? 'in' : 'cm');

  return {
    pad, ymd, parseYmd, addDays, today, daysBetween, range, clamp, clamp01, sum, mean, sd, median, round, isNum, num,
    minOfDay, noonRel, isoToDate, isoLocal, minutesBetween, fmtDur, fmtHrs, fmtInt, fmt1, fmtSigned, fmtClock,
    wd, fmtDay, fmtDayLong, fmtShort, MO, uid, rng, gauss, esc,
    kgTo, toKg, wUnit, cmTo, toCm, lUnit, KG_PER_LB,
  };
})();
