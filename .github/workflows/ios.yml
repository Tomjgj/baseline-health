# Builds the iPhone app (with its watch app, widgets and complications) on a macOS runner and launches it in the iOS Simulator,
# and builds Baseline Lite (the same app without widgets, for free Apple IDs) so it can't rot.
# Runs when ios/, index.html or the coach's config changes, or by hand from the Actions tab.
name: iOS build

on:
  push:
    paths: ['ios/**', 'index.html', 'foods-usda.json', 'server/coach.mjs', 'server/export-config.mjs', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'index.html', 'foods-usda.json', 'server/coach.mjs', 'server/export-config.mjs', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write   # to commit the regenerated Xcode project
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # the app's built-in coach sends the server's model, system prompt and tools from ios/Baseline/coach.json;
      # it must be exactly what server/export-config.mjs writes from server/coach.mjs
      - name: Check the coach config matches the server
        run: |
          cd server && npm ci && node export-config.mjs && cd ..
          if [ -n "$(git status --porcelain ios/Baseline/coach.json)" ]; then
            echo "ios/Baseline/coach.json is out of date: run 'cd server && node export-config.mjs' and commit it."
            git diff ios/Baseline/coach.json | head -20
            exit 1
          fi

      # the food database is built by foods.yml; until it's committed, the app bundles an empty one
      - name: Make sure the food database file exists
        run: '[ -f foods-usda.json ] || echo ''{"v":1,"foods":[]}'' > foods-usda.json'

      - name: Generate the Xcode projects
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodegen generate --spec project-lite.yml

      # keep the committed projects in step with the specs, so they can be opened with a double-click
      - name: Commit the Xcode projects if they changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the projects plus the Info.plist and entitlements files XcodeGen writes next to the sources (Lite's are in ios/Lite)
          git add ios/Baseline.xcodeproj "ios/Baseline Lite.xcodeproj" ios/Lite \
            ios/Baseline/Info.plist ios/Baseline/Baseline.entitlements ios/Watch/Info.plist ios/Watch/BaselineWatch.entitlements \
            ios/Widgets/Info.plist ios/Widgets/BaselineWidgets.entitlements ios/WatchWidgets/Info.plist ios/WatchWidgets/BaselineWatchWidgets.entitlements
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate the Xcode projects, Info.plist and entitlements from the XcodeGen specs"
            git push
          fi

      # a downloaded copy of the repo must have every file the build needs
      - name: Check nothing the build needs is missing from the repo
        run: |
          left=$(git status --porcelain --untracked-files=all ios/ | grep -v '^?? ios/build/' || true)
          if [ -n "$left" ]; then echo "Generated but not committed:"; echo "$left"; exit 1; fi

      - name: Build for the simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Baseline.xcodeproj -scheme Baseline -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO BASE_BUNDLE_ID=com.example.baseline build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          APP=build/Build/Products/Debug-iphonesimulator/Baseline.app
          test -d $APP
          # the watch app is built with it and embedded, and so are the widgets (iPhone) and the complications (watch)
          test -d $APP/Watch/BaselineWatch.app
          test -d $APP/PlugIns/BaselineWidgets.appex
          test -d $APP/Watch/BaselineWatch.app/PlugIns/BaselineWatchWidgets.appex
          # the coach's config travels as a resource
          test -f $APP/coach.json

      - name: Launch in the simulator
        run: |
          set -x
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/build/Build/Products/Debug-iphonesimulator/Baseline.app
          xcrun simctl launch "$DEVICE" com.example.baseline
          # the page must render and ask the native side for Health data; a slow simulator can take a while, so wait up to 2 minutes
          for i in $(seq 1 24); do
            sleep 5
            xcrun simctl spawn "$DEVICE" log show --last 10m --style compact --predicate 'subsystem == "com.example.baseline"' > app.log 2>/dev/null || true
            if grep -q "page: Baseline Health | rendered" app.log && grep -q "sync request" app.log; then break; fi
          done
          cat app.log
          xcrun simctl io "$DEVICE" screenshot launch.png
          # the app must still be running
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i baseline
          grep -q "page: Baseline Health | rendered" app.log
          grep -q "sync request" app.log

      - name: Build the watch app for the watch simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Baseline.xcodeproj -scheme BaselineWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO BASE_BUNDLE_ID=com.example.baseline build 2>&1 | tee watchbuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-watchsimulator/BaselineWatch.app
          test -d build/Build/Products/Debug-watchsimulator/BaselineWatch.app/PlugIns/BaselineWatchWidgets.appex

      # the watch app must launch on its own and draw its home screen
      - name: Launch the watch app in a watch simulator
        run: |
          set -x
          WATCH=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'watchOS' in k for x in d[k] if 'Watch' in x['name']))")
          xcrun simctl boot "$WATCH"
          xcrun simctl bootstatus "$WATCH" -b
          xcrun simctl install "$WATCH" ios/build/Build/Products/Debug-watchsimulator/BaselineWatch.app
          xcrun simctl launch "$WATCH" com.example.baseline.watchkitapp
          for i in $(seq 1 18); do
            sleep 5
            xcrun simctl spawn "$WATCH" log show --last 10m --style compact --predicate 'subsystem == "com.example.baseline"' > watch.log 2>/dev/null || true
            grep -q "watch: home rendered" watch.log && break
          done
          cat watch.log
          xcrun simctl io "$WATCH" screenshot watch.png
          grep -q "watch: home rendered" watch.log

      # Baseline Lite: the same app and watch app, no widgets or App Groups. Built (not launched) so it keeps compiling.
      - name: Build Baseline Lite for the simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project "Baseline Lite.xcodeproj" -scheme Baseline -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-lite CODE_SIGNING_ALLOWED=NO BASE_BUNDLE_ID=com.example.baseline build 2>&1 | tee litebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build-lite/Build/Products/Debug-iphonesimulator/Baseline.app/Watch/BaselineWatch.app
          # no widgets in Lite
          test ! -d build-lite/Build/Products/Debug-iphonesimulator/Baseline.app/PlugIns/BaselineWidgets.appex

      - name: Keep the build log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/xcodebuild.log
            ios/watchbuild.log
            ios/litebuild.log
            watch.png
            watch.log
            launch.png
            app.log
          if-no-files-found: ignore
