# What the two Xcode projects share: the iPhone app and its Apple Watch app. project.yml (Baseline.xcodeproj) adds the
# widgets, the Live Activity and the watch complications, which need an App Group; project-lite.yml (Baseline Lite.xcodeproj)
# is the same app without them, for free Apple IDs whose Personal Team can't use App Groups.
# Each project names its own Info.plist and entitlements paths, so the two never write the same file.
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    # unique per developer team, so nobody has to invent a bundle id before pressing Run; the watch app's id is this plus .watchkitapp
    BASE_BUNDLE_ID: com.baselinehealth.app.$(DEVELOPMENT_TEAM)
targets:
  Baseline:
    type: application
    platform: iOS
    sources:
      - path: Baseline
        # each project writes its own Info.plist and entitlements; neither belongs in the app's resources
        excludes: [Info.plist, "*.entitlements"]
      - path: Shared/Glance.swift
      - path: Shared/WorkoutAttributes.swift
      # the web app itself, bundled as-is and served to the web view from baseline://app/
      - path: ../index.html
        buildPhase: resources
      # the offline food database (built by .github/workflows/foods.yml), served next to the page
      - path: ../foods-usda.json
        buildPhase: resources
        optional: true
    dependencies:
      # the watch app ships inside the iPhone app
      - target: BaselineWatch
    info:
      properties:
        CFBundleDisplayName: Baseline
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHealthShareUsageDescription: Baseline reads your sleep, heart rate, HRV, activity, workouts, daylight, caffeine, water and body measurements to work out recovery, strain and stress against your own baselines. Your Health data stays on your iPhone; only what you ask the coach goes to Anthropic.
        NSHealthUpdateUsageDescription: When you turn on Save to Apple Health in Settings, Baseline saves the water, food, weigh-ins, naps and workouts you log so your other apps see them. It's off until you turn it on.
        NSCameraUsageDescription: Baseline uses the camera to scan food barcodes. Nothing is recorded or stored.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    entitlements:
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Health wakes the app when new sleep, workouts, HRV or water arrive
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BaselineWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: [Info.plist, "*.entitlements"]
      - path: Shared/Glance.swift
    info:
      properties:
        CFBundleDisplayName: Baseline
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BASE_BUNDLE_ID)
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Baseline reads your heart rate and energy during workouts.
        NSHealthUpdateUsageDescription: When you turn on Save to Apple Health in Baseline on your iPhone, workouts you track on your watch are saved to Apple Health.
    entitlements:
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
